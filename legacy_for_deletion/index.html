const num=(n,d=0)=>n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:d}), pct=n=>n==null?'—':`${(n*100).toFixed(1)}%`, hours=n=>n==null?'No crossing':`${num(n,1)}h`, badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;
let state=null,datasets=[],view=['overview','materials','evaluation','data','insights','alerts','forecast'].includes(initialParams.get('view'))?initialParams.get('view'):'overview',selected='DEM-101',dataset=initialParams.get('dataset')||'demo',filterText='',filterRisk='all',filterArea='all',chartHours=12,dialogTask=null,busy=false,toastTimer;
function toast(message,error=false){$('#toast').textContent=message;$('#toast').className=error?'error':'';$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,error?9000:4500)}
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data;try{data=await response.json()}catch{throw Error('The server returned an unreadable response.')}if(!response.ok)throw Error(data.error||'Request failed.');return data}
async function load(){const requested=dataset;const results=await Promise.all([api('/api/datasets'),api('/api/state?dataset='+encodeURIComponent(dataset))]);if(requested!==dataset)return;const next=results[1];if(next.dataset.kind==='workbook')next.insights=await api('/api/insights?dataset='+encodeURIComponent(requested));if(requested!==dataset)return;datasets=results[0];state=next;if(!state.materials.some(m=>m.id===selected))selected=state.materials[0]?.id;$('#dataset').innerHTML=datasets.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}${d.kind==='synthetic'?' · Demo':''}</option>`).join('');$('#dataset').value=dataset;render()}
async function mutate(path,body,message){if(busy)return;busy=true;document.body.classList.add('busy');try{await api(path,{dataset,...body});await load();if(message)toast(message)}catch(e){toast(e.message,true)}finally{busy=false;document.body.classList.remove('busy')}}
function refsOf(a){const R=Object.assign({},a?.references||{});for(const k of ['tolerances','bom'])if(R[k]&&R[k].loaded===false)R[k]=null;return R}
function render(){const synthetic=state.dataset.kind==='synthetic';$('#notice').innerHTML=synthetic?'<span class="tag">SYNTHETIC DEMO</span><span>Illustrative factory data. Forecasts and evaluation demonstrate behavior; they do not measure Siemens performance.</span>':'<span class="tag">LOCAL WORKBOOK</span><span>Source data saved locally. Descriptive analytics are available; what-if estimates show their assumptions and are not validated forecasts.</span>';const names={overview:'Overview',materials:'Materials & alerts',evaluation:'Model evaluation',data:'Data workspace',insights:'Workbook insights',alerts:'Stock alerts',forecast:'Part forecast'};$('#crumb').textContent=names[view];document.querySelectorAll('[data-view]').forEach(b=>{if(b.closest('nav'))b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#storage-status').textContent=`${state.run_count} saved forecast runs · SQLite persistence`;$('#content').innerHTML=view==='overview'?overview():view==='materials'?materialsView():view==='evaluation'?evaluationView():view==='insights'?workbookView():view==='alerts'?stockView():view==='forecast'?forecastView():dataView();bindView()}
function head(eyebrow,title,subtitle,buttons=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${buttons}</div></div>`}
function exportButton(){return '<button data-action="export">↓ Export report</button>'}
function unavailable(){return '<div class="card"><div class="empty"><strong>Data definitions are still needed</strong>The workbook is saved and ready for review. Open Data workspace to see quality findings and the inputs needed for depletion forecasting.<br><button data-view="data" style="margin-top:18px">Review data readiness →</button> <button data-view="insights" style="margin-top:18px">View workbook insights →</button></div></div>'}
function overview(){if(!state.materials.length)return workbookView();const ms=state.materials,critical=ms.filter(m=>m.forecast.risk==='Critical').length,watch=ms.filter(m=>m.forecast.risk==='Watch').length,active=state.alerts.filter(a=>a.status!=='Delivered').length,model=state.evaluation?.models[1];return head('MATERIAL INTELLIGENCE','Stay ahead of the next shortage.','A clear view of material risk, replenishment timing, and production demand.',exportButton()+'<button class="primary" data-action="forecast">↻ Run forecast</button>')+`<div class="stats"><div class="stat"><div class="stat-label">Monitored materials <span class="stat-icon">▦</span></div><div class="stat-value">${ms.length}<span style="font-size:15px;color:#9aa9ae;font-weight:400"> / ${ms.length}</span></div><small>Across 3 supermarket areas</small></div><div class="stat"><div class="stat-label">Action needed <span class="stat-icon red">↗</span></div><div class="stat-value red">${critical}</div><small>${watch} more within the warning buffer</small></div><div class="stat"><div class="stat-label">Open recommendations <span class="stat-icon">◷</span></div><div class="stat-value">${active}</div><small>Saved across browser sessions</small></div><div class="stat"><div class="stat-label">Synthetic event recall <span class="stat-icon">⌁</span></div><div class="stat-value teal">${pct(model?.recall)}</div><small>${state.evaluation?.sample_count||0} held-out simulated scenarios</small></div></div><div class="grid"><div class="card">${chartCard()}</div><div class="stack">${scenarioCard()}<div class="card"><div class="card-head"><h2>How to read this view</h2></div><div class="card-body"><p class="subtitle">A warning opens when a projected minimum crossing falls inside the warehouse lead time plus your buffer.</p><div class="step-line"><span>Forecast</span><span>Dispatch</span><span>Confirm receipt</span></div><p class="subtitle" style="font-size:11px;margin-top:15px">Simulation clock: Sep 29, 12:00 UTC. Replay time stays fixed so scenarios can be compared.</p></div></div></div></div><div class="grid"><div class="card"><div class="card-head"><div><h2>Replenishment watchlist</h2><p class="subtitle">Ranked by time to minimum tolerance</p></div><button class="link-button" data-view="materials">View all →</button></div>${materialTable(true)}</div><div class="card"><div class="card-head"><h2>Recommendation queue</h2><span class="pill">${active} active</span></div>${alertList(3)}</div></div>`}
function chartCard(){const m=state.materials.find(m=>m.id===selected)||state.materials[0];return `<div class="card-head"><div><h2>Inventory outlook</h2><p class="subtitle">Recent consumption and the next ${chartHours} hours</p></div>${badge(m.forecast.risk)}</div><div class="card-body"><div class="chart-title"><label class="sr-only" for="chart-material">Chart material</label><select id="chart-material">${state.materials.map(a=>`<option value="${esc(a.id)}" ${a.id===m.id?'selected':''}>${esc(a.id)} · ${esc(a.name)}</option>`).join('')}</select><label class="sr-only" for="chart-range">Chart time window</label><select id="chart-range">${[6,12,24].map(h=>`<option value="${h}" ${h===chartHours?'selected':''}>± ${h} hours</option>`).join('')}</select><button class="small ghost" data-policy="${esc(m.id)}">Edit policy</button></div>${inventoryChart(m)}<div class="chart-legend"><span><i class="legend-line"></i>Observed / schedule adjusted</span><span><i class="legend-line dashed"></i>Trailing average</span><span><i class="legend-line threshold"></i>Minimum tolerance</span></div><div class="forecast-strip"><div><small>AVAILABLE STOCK</small><strong>${num(m.stock)} <span style="font-size:11px;font-weight:400">pieces</span></strong></div><div><small>TIME TO MINIMUM</small><strong class="${m.forecast.risk==='Critical'?'red':'teal'}">${hours(m.forecast.hours_to_threshold)}</strong></div><div><small>WAREHOUSE LEAD TIME</small><strong>${num(m.lead_hours,1)}h</strong></div></div></div>`}
function inventoryChart(m){const W=680,H=252,l=45,r=18,t=19,b=35,x=h=>l+(h+chartHours)/(chartHours*2)*(W-l-r);const hist=m.history.slice(-(chartHours+1)),max=Math.max(m.stock,...hist.map(h=>h.stock))*1.14||100,y=v=>H-b-v/max*(H-t-b);const path=points=>points.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');const observed=hist.map((p,i)=>[i-hist.length+1,p.stock]);observed.push([0,m.stock]);const forecast=rate=>Array.from({length:chartHours*2+1},(_,i)=>[i/2,Math.max(0,m.stock-rate*i/2)]);const ticks=[0,1,2,3,4].map(i=>{const v=max*i/4;return `<line x1="${l}" y1="${y(v)}" x2="${W-r}" y2="${y(v)}" stroke="#edf1f2"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`}).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} stock history and forecast; minimum ${m.threshold} pieces, crossing ${hours(m.forecast.hours_to_threshold)}"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34bd9b" stop-opacity=".16"/><stop offset="1" stop-color="#34bd9b" stop-opacity=".01"/></linearGradient></defs><rect x="${x(0)}" y="${t}" width="${x(chartHours)-x(0)}" height="${H-t-b}" fill="#f6faf9"/>${ticks}<path d="${path(observed)} L${x(0)},${y(0)} L${x(observed[0][0])},${y(0)} Z" fill="url(#chart-fill)"/><line x1="${l}" y1="${y(m.threshold)}" x2="${W-r}" y2="${y(m.threshold)}" stroke="#d8a44e" stroke-dasharray="4 5"/><path d="${path(observed)}" fill="none" stroke="#119a84" stroke-width="2.5"/><path d="${path(forecast(m.baseline.rate||0))}" fill="none" stroke="#9eafb6" stroke-width="2" stroke-dasharray="6 5"/><path d="${path(forecast(m.forecast.rate||0))}" fill="none" stroke="#119a84" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="${x(0)}" y1="${t}" x2="${x(0)}" y2="${H-b}" stroke="#bed0cd" stroke-dasharray="3 4"/><circle cx="${x(0)}" cy="${y(m.stock)}" r="4" fill="#119a84" stroke="white" stroke-width="2"/>${[-chartHours,-chartHours/2,0,chartHours/2,chartHours].map(h=>`<text x="${x(h)}" y="${H-12}" text-anchor="middle">${h===0?'Now':h>0?'+'+h+'h':h+'h'}</text>`).join('')}<text x="${x(0)+12}" y="${t+13}">PROJECTED</text><text x="${l}" y="12">pieces</text></svg>`}
function scenarioCard(){return `<div class="card scenario"><div class="card-head"><div><h2>What if demand changes?</h2><p class="subtitle">Adjust the planned production load</p></div></div><div class="card-body"><div class="load-value"><output id="load-value">${num(state.dataset.demand_factor,2)}×</output></div><label for="demand" class="sr-only">Production demand multiplier</label><input id="demand" type="range" min="0.25" max="3" step="0.05" value="${state.dataset.demand_factor}"><div class="range-labels"><span>0.25× · Slower</span><span>3× · Faster</span></div><button data-action="scenario">Apply scenario & save</button><p class="scenario-note">Recalculates the schedule estimate. Historical observations and the fixed evaluation set stay intact.</p></div></div>`}
function sortedMaterials(){const priority={Critical:0,Watch:1,Healthy:2,Stale:3,Unknown:4};return [...state.materials].sort((a,b)=>priority[a.forecast.risk]-priority[b.forecast.risk]||(a.forecast.hours_to_threshold??Infinity)-(b.forecast.hours_to_threshold??Infinity))}
function materialRows(ms){return ms.length?ms.map(m=>`<tr><td><strong>${esc(m.name)}</strong><small>${esc(m.id)} · ${esc(m.area)} / ${esc(m.bin)}</small></td><td>${num(m.stock)}<small>Min. ${num(m.threshold)} PC</small></td><td>${badge(m.forecast.risk)}</td><td><strong>${hours(m.forecast.hours_to_threshold)}</strong><small>Lead time ${num(m.lead_hours,1)}h</small></td><td><button class="small" data-inspect="${esc(m.id)}">Inspect</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No materials match these filters.</td></tr>'}
function materialTable(short=false){let ms=sortedMaterials();if(short)ms=ms.slice(0,5);return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>MATERIAL / LOCATION</th><th>STOCK</th><th>RISK</th><th>MINIMUM IN</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="material-rows">${materialRows(ms)}</tbody></table></div><div class="table-foot" id="material-count">Showing ${ms.length} of ${state.materials.length} materials · Estimates use known hourly consumption.</div>`}

function materialsView(){return head('REPLENISHMENT OPERATIONS','Every material. One clear priority.','Inspect risk, adjust a policy, and record a simulated replenishment.',exportButton()+`<button class="primary" data-action="forecast" ${state.materials.length?'':'disabled'}>↻ Run forecast</button>`)+(state.materials.length?`<div class="card" style="margin-bottom:22px"><div class="filters"><label class="sr-only" for="search">Search materials</label><input id="search" type="search" placeholder="Search name, material ID, or bin…" value="${esc(filterText)}"><label class="sr-only" for="risk-filter">Risk filter</label><select id="risk-filter"><option value="all">All risk levels</option>${['Critical','Watch','Healthy','Stale','Unknown'].map(r=>`<option ${r===filterRisk?'selected':''}>${r}</option>`).join('')}</select><label class="sr-only" for="area-filter">Area filter</label><select id="area-filter"><option value="all">All areas</option>${[...new Set(state.materials.map(m=>m.area))].map(a=>`<option ${a===filterArea?'selected':''}>${a}</option>`).join('')}</select></div>${materialTable()}</div><div class="grid"><div class="card">${chartCard()}</div><div class="card"><div class="card-head"><h2>Recommendation queue</h2><span class="pill">Simulated actions</span></div>${alertList()}</div></div><div class="card"><div class="card-head"><h2>Saved activity</h2></div><div class="card-body">${activity()}</div></div>`:unavailable())}

function evaluationView(){let e=state.evaluation;const heading=head('MODEL VALIDATION','Evidence before deployment.','Compare both estimators on the same held-out outcomes.',exportButton()+`<button class="primary" data-action="evaluate" ${state.dataset.kind==='synthetic'?'':'disabled'}>↻ Run evaluation</button>`);if(!e)return heading+unavailable();const [b,c]=e.models;return heading+`<div class="callout"><strong>Synthetic evaluation — not production accuracy</strong>${esc(e.limitations)}</div><div class="stats"><div class="stat"><div class="stat-label">Held-out scenarios</div><div class="stat-value">${e.sample_count}</div><small>Independent 12-hour outcome windows</small></div><div class="stat"><div class="stat-label">Actual threshold events</div><div class="stat-value">${c.actual_events}</div><small>3-hour warehouse lead time</small></div><div class="stat"><div class="stat-label">Schedule timing error</div><div class="stat-value teal">${num(c.mae_hours,2)}h</div><small>MAE · ${c.error_samples} actual-event cases</small></div><div class="stat"><div class="stat-label">Forecast coverage</div><div class="stat-value">${pct(c.coverage)}</div><small>Eligible synthetic observations</small></div></div><div class="two-col"><div class="card"><div class="card-head"><h2>Event detection</h2><span class="pill">Higher is better</span></div><div class="card-body">${['precision','recall','actionable_recall'].map(k=>`<h3 style="margin-top:17px">${({precision:'Alert precision',recall:'Event recall',actionable_recall:'Actionable recall'})[k]}</h3>${[b,c].map(m=>`<div class="metric-row"><span>${m.name}</span><div class="bar-track"><div class="bar ${m.id}" style="width:${(m[k]||0)*100}%"></div></div><b>${pct(m[k])}</b></div>`).join('')}`).join('')}<p class="subtitle" style="font-size:11px;margin-top:20px">Actionable recall counts detected events with at least 3 hours remaining to replenish. Precision penalizes a warning when no event follows within 12 hours.</p></div></div><div class="card"><div class="card-head"><h2>Predicted vs. observed crossing</h2><span class="pill">Schedule estimator</span></div><div class="card-body">${scatter(e)}<p class="subtitle" style="font-size:11px">Each point is an actual threshold event. The diagonal is perfect timing; distance from it is prediction error.</p></div></div></div><div class="card" style="margin-bottom:22px"><div class="card-head"><h2>Comparison report</h2><span class="pill">Saved ${new Date(e.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="table-wrap" style="margin-top:15px"><table class="result-table"><thead><tr><th>ESTIMATOR</th><th>HITS</th><th>FALSE ALERTS</th><th>MISSED EVENTS</th><th>ACTIONABLE HITS</th><th>MEAN LEAD</th><th>TIMING MAE</th></tr></thead><tbody>${e.models.map(m=>`<tr><td><strong>${m.name}</strong></td><td>${m.true_positives}</td><td>${m.false_positives}</td><td>${m.false_negatives}</td><td>${m.actionable_events}</td><td>${num(m.mean_lead_hours,2)}h</td><td>${num(m.mae_hours,2)}h</td></tr>`).join('')}</tbody></table></div><div class="card-body"><h3>Reproducible protocol</h3><p class="subtitle">${esc(e.protocol)}</p><p class="subtitle" style="font-size:11px;margin-top:10px">Fixed seed: 48209 · Engine ${esc(e.engine_version)} · SHA-256 ${esc(e.checksum.slice(0,20))}…<br>Consumption after the decision is excluded from prediction. Evaluation uses a fixed policy and is independent of sandbox policy edits and demand changes. Baseline: last 6 hours. Schedule estimator: prior 12 hours normalized by load.</p></div></div><div class="card"><div class="card-head"><h2>Scenario evidence</h2><span class="pill">First 12 of ${e.sample_count}</span></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>SCENARIO</th><th>PREDICTED CROSSING</th><th>OBSERVED IN 12H</th><th>RESULT</th></tr></thead><tbody>${e.examples.slice(0,12).map(x=>`<tr><td>${x.id}</td><td>${hours(x.predicted_hours)}</td><td>${hours(x.actual_hours)}</td><td>${esc(x.outcome)}</td></tr>`).join('')}</tbody></table></div></div>`}
function scatter(e){const points=e.examples.filter(x=>x.actual_hours!=null&&x.predicted_hours!=null),max=Math.ceil(Math.max(12,...points.map(p=>p.predicted_hours))),w=460,h=300,l=45,t=15,r=20,b=43,x=v=>l+v/max*(w-l-r),y=v=>h-b-v/max*(h-t-b);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Scatter plot of predicted versus observed hours for synthetic threshold events">${[0,.25,.5,.75,1].map(f=>`<line x1="${l}" y1="${y(f*max)}" x2="${w-r}" y2="${y(f*max)}" stroke="#edf1f2"/><text x="${l-9}" y="${y(f*max)+4}" text-anchor="end">${num(f*max)}</text><text x="${x(f*max)}" y="${h-b+19}" text-anchor="middle">${num(f*max)}</text>`).join('')}<path d="M${x(0)},${y(0)} L${x(max)},${y(max)}" stroke="#a9bcb9" stroke-dasharray="5 5"/>${points.map(p=>`<circle cx="${x(p.actual_hours)}" cy="${y(p.predicted_hours)}" r="4" fill="#159e83" opacity=".7"><title>${p.id}: actual ${p.actual_hours}h, prediction ${num(p.predicted_hours,2)}h</title></circle>`).join('')}<text x="${w/2}" y="${h-3}" text-anchor="middle">Observed hours to minimum</text><text x="7" y="15">Predicted hours</text></svg>`}

ndings</div><div class="stat-value">${q.findings.length}</div><small>Findings may affect the same rows</small></div><div class="stat"><div class="stat-label">Forecast readiness</div><div class="stat-value" style="font-size:24px">${q.forecast_ready?'Demo ready':'Needs review'}</div><small>${q.forecast_ready?'Synthetic inputs only':'No unsupported accuracy claims'}</small></div></div><div class="card" style="margin-bottom:22px"><div class="card-head"><h2>Source inventory</h2></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>SOURCE</th><th>ROWS</th><th>COLUMNS</th><th>CANDIDATE GRAIN</th></tr></thead><tbody>${q.sheets.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${num(s.rows)}</td><td>${s.columns}</td><td>${esc(s.grain)}</td></tr>`).join('')}</tbody></table></div><div class="table-foot">${state.dataset.kind==='workbook'?`Workbook date system: ${esc(q.date_system)} · Timezone: ${esc(q.timezone)} · SHA-256: ${esc(q.checksum.slice(0,16))}…`:esc(q.description)}</div></div><div class="two-col"><div class="card"><div class="card-head"><h2>Quality findings</h2></div><div class="card-body">${q.findings.length?q.findings.map(f=>`<div class="quality-item"><b>${esc(f.code.replaceAll('_',' '))} · ${num(f.count)} occurrences</b><small>${esc(f.sheet)} · ${esc(f.severity)}</small>${esc(f.message)}</div>`).join(''):'<p class="subtitle">No structural findings in this generated dataset. This does not establish the quality of manufacturing source data.</p>'}</div></div><div class="card"><div class="card-head"><h2>Potential join coverage</h2></div><div class="card-body">${q.joins.length?q.joins.map(j=>`<h3>${esc(j.name)}</h3><div class="metric-row" style="grid-template-columns:1fr 1fr 45px"><span>${num(j.matched)} / ${num(j.total)} rows</span><div class="bar-track"><div class="bar" style="width:${j.total?j.matched/j.total*100:0}%"></div></div><b>${j.total?pct(j.matched/j.total):'—'}</b></div><p class="subtitle" style="font-size:11px;margin-bottom:25px" function stockRows(){
 if(!$('#stock-rows'))return;const d=stockData,openBy=Object.fromEntries(d.open_alerts.map(a=>[a.position,a])),q=stockSearch.toLowerCase(),order={Alert:0,Predicted:1,'No tolerance':2,'No stock':3,OK:4};

 $('#stock-count').textContent=`${rows.length.toLocaleString()} matching positions · page ${stockPage+1} of ${pages}`;$('#stock-prev').disabled=stockPage===0;$('#stock-next').disabled=stockPage>=pages-1}

  return `<div class="card" style="margin-bottom:22px"><div class="card-head"><div><h2>Reference files</h2><p class="subtitle">Min/Max tolerances, a BOM, or dated stock snapshots for this workbook</p></div><span class="pill">XLSX or CSV · up to 32 MB</span></div><div class="card-body"><div class="ref-form"><div><label for="ref-input">Reference file</label><input id="ref-input" type="file" accept=".xlsx,.csv" aria-label="Import reference file"></div><div><label for="ref-asof">Snapshot date (stock snapshots only)</label><input id="ref-asof" type="date" aria-label="Snapshot date"></div></div><p id="ref-status" class="subtitle" aria-live="polite" style="font-size:11px;margin-top:13px">The file type is detected from its headers. Importing refreshes the insights; source rows are unchanged.</p>${item('Min/Max tolerances',t,t?`${num(t.rows)} rows · ${num(t.matched_positions)} matched positions · ${num(t.zero_min)} with zero minimum · ${num(t.invalid)} min > max · ${num(t.max_not_set??0)} max not set`:'Import the Min/Max file to add minimums and maximums.')}${item('Bill of materials',b,b?`${num(b.rows)} rows · ${num(b.line_items)} line items · ${num(b.parts)} parts · ${num(b.production_orders_covered)} of ${num(b.production_orders_total)} production orders covered`:'Import the BOM file to estimate BOM-implied demand.')}${item('Stock snapshots',sn.length,sn.length?sn.map(x=>`${esc(x.as_of)} (${num(x.rows)} rows)`).join(' · '):'Optional. Two or more dated snapshots allow observed depletion to be calculated.')}</div></div>`;

async function uploadRef(file){

  const asOf=$('#ref-asof').value;
  try{const res=await fetch('/api/import?filename='+encodeURIComponent(file.name)+'&dataset='+encodeURIComponent(dataset)+(asOf?'&as_of='+encodeURIComponent(asOf):''),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});let r;try{r=await res.json()}catch{throw Error('The server returned an unreadable response.')}if(!res.ok)throw Error(r.error||'Reference import failed.');stockData=null;stockFor=null;await load();toast(`Reference file imported${r.kind?' ('+r.kind+')':''}. Insights refreshed.`)}
  catch(e){toast(e.message,true);if($('#ref-status'))$('#ref-status').textContent=e.message}
  finally{busy=false;if($('#ref-input'))$('#ref-input').disabled=false}

function riskOf(r,h){const d=r.days_to_min_replen;return r.at_or_below_min?'Below min':d!=null&&d*24<=h?'Within horizon':d!=null?'OK':'No rate'}
const riskClass={'Below min':'Critical','Within horizon':'Watch','OK':'Healthy','No rate':'Unknown'},riskRank={'Below min':0,'Within horizon':1,'OK':2,'No rate':3};
const covPct=(n,d)=>n==null||!d?'—':pct(n/d);
const shortDate=v=>v?new Date(v.slice(0,10)+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Not available';
function dateSpan(r){return r.start?`${shortDate(r.start)} — ${shortDate(r.end)}`:'No valid dates'}
function miniBars(rows,key,title,color='#129b83'){
  if(!rows.length)return '<div class="empty">No dated observations available.</div>';
  const w=660,h=237,left=47,right=14,top=24,bottom=47,max=Math.max(1,...rows.map(r=>r[key])),bar=(w-left-right)/rows.length;
  const ticks=[0,.5,1].map(f=>`<line x1="${left}" y1="${h-bottom-f*(h-top-bottom)}" x2="${w-right}" y2="${h-bottom-f*(h-top-bottom)}" stroke="#e9eff0"/><text x="${left-8}" y="${h-bottom-f*(h-top-bottom)+4}" text-anchor="end">${num(max*f)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}">${ticks}${rows.map((r,i)=>{const bh=r[key]/max*(h-top-bottom),x=left+i*bar+bar*.19,period=r.period.length===7?new Date(r.period+'-01T12:00:00').toLocaleDateString(undefined,{month:'short',year:'2-digit'}):new Date(r.period+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});return `<rect x="${x}" y="${h-bottom-bh}" width="${bar*.62}" height="${bh}" rx="3" fill="${color}" opacity=".9"><title>${esc(r.period)}: ${num(r[key])}</title></rect><text x="${left+i*bar+bar/2}" y="${h-bottom+21}" text-anchor="middle" style="font-size:${rows.length>10?9:11}px">${esc(period)}</text>`}).join('')}</svg>`;
}

  return head('WORKBOOK ANALYTICS','Your data, put to work.','Observed stock, transfer activity, and production patterns from the supplied extract.',exportButton()+'<button data-view="data">Data quality →</button>')+
  `<div class="source-dates"><div><small>HISTORICAL PRODUCTION</small><strong>${dateSpan(p.date_range)}</strong></div><div><small>PLANNED SALES-ORDER LINES</small><strong>${dateSpan(s.date_range)}</strong></div><div><small>STOCK SNAPSHOT</small><strong>As-of time not supplied</strong></div></div>
  <div class="stats five"><div class="stat"><div class="stat-label">Snapshot positions</div><div class="stat-value">${num(inv.positions)}</div><small>${num(inv.materials)} distinct materials · ${num(inv.empty_positions)} empty in snapshot</small></div><div class="stat"><div class="stat-label">Below min</div><div class="stat-value red" id="tile-below">${num(riskCount('Below min'))}</div><small>Stock at or below a positive minimum</small></div><div class="stat"><div class="stat-label">Within horizon</div><div class="stat-value" id="tile-within" style="color:var(--amber)">${num(riskCount('Within horizon'))}</div><small>Estimated to reach minimum inside the warning horizon</small></div><div class="stat"><div class="stat-label">Tolerance coverage</div><div class="stat-value teal">${rf.tolerances?covPct(rf.tolerances.matched_positions,inv.positions):'—'}</div><small>${rf.tolerances?num(rf.tolerances.matched_positions)+' positions have Min/Max':'Import the Min/Max file in Data workspace'}</small></div><div class="stat"><div class="stat-label">BOM coverage</div><div class="stat-value teal">${rf.bom?covPct(rf.bom.production_orders_covered,rf.bom.production_orders_total):'—'}</div><small>${rf.bom?'Production orders with a BOM item':'Import the BOM file in Data workspace'}</small></div></div>
  <div class="grid"><div class="card"><div class="card-head"><div><h2>Recorded replenishment activity</h2><p class="subtitle">Confirmed transfer events by week · most recent 12 observed weeks</p></div></div><div class="card-body">${miniBars(t.weekly.slice(-12),'count','Weekly confirmed transfer events')}<div class="summary-grid"><div><small>MEDIAN CONFIRMATION</small><strong>${num(t.median_confirmation_hours,2)}h</strong></div><div><small>90TH PERCENTILE</small><strong>${num(t.p90_confirmation_hours,2)}h</strong></div><div><small>ZERO-TIME RECORDS</small><strong>${num(t.zero_duration_events)}</strong></div></div><h3 style="margin-top:6px">Transfer categories</h3>${t.categories?`<div class="summary-grid" style="grid-template-columns:repeat(2,1fr)"><div><small>REPLENISHMENT (FEEDS RATES)</small><strong>${num(cat.replenishment)}</strong></div><div><small>RETURN TO WAREHOUSE</small><strong>${num(cat.return_to_warehouse)}</strong></div><div><small>SUPERMARKET TRANSFER</small><strong>${num(cat.supermarket_transfer)}</strong></div><div><small>OTHER</small><strong>${num(cat.other)}</strong></div></div>`:'<p class="hint">Transfer categories are not available for this cached analysis. Re-import the workbook to classify transfers.</p>'}<p class="analysis-note">Creation → confirmation is a recorded system interval, not verified warehouse travel time. ${num(t.conflicting_duplicate_keys)} conflicting transfer keys, ${num(t.invalid_time_order)} reversed-time records, ${num(t.duplicate_events)} duplicate keys, ${num(t.missing_dates)} undated records, ${num(t.missing_keys)} missing keys, and ${num(t.invalid_quantities)} invalid quantities are excluded. Historical period: ${dateSpan(t.date_range)}.</p></div></div>
  <div class="card"><div class="card-head"><div><h2>A simple replenishment what-if</h2><p class="subtitle">Saved scenario · uses explicit assumptions</p></div><span class="pill">Not a forecast</span></div><div class="card-body">${workbookScenarioForm(a)}</div></div></div>
  <div class="card" style="margin-bottom:22px"><div class="card-head"><div><h2>Stock snapshot review</h2><p class="subtitle">Below-minimum positions first, then the shortest estimated days to minimum. Rates are estimates, not validated forecasts. ${num(inv.duplicate_rows)} repeated stock segments excluded; ${num(inv.missing_key_rows)} rows lack identifiers.</p></div></div><div class="filters"><label class="sr-only" for="workbook-search">Search workbook inventory</label><input id="workbook-search" type="search" value="${esc(workbookSearch)}" placeholder="Find a material, description, or bin…"><label class="sr-only" for="workbook-filter">Workbook inventory filter</label><select id="workbook-filter"><option value="all">All positions</option><option value="below">Below min</option><option value="within">Within horizon</option><option value="notol">No tolerance</option></select></div><div class="horizon-bar"><div><label for="workbook-horizon">Warning horizon (hours)</label><input id="workbook-horizon" type="number" min="0" max="720" step="1" value="${esc(hz)}"></div><p class="hint">Status: Below min, then Within horizon (estimated days to minimum × 24 ≤ horizon), then OK, then No rate. Recomputed in your browser; nothing is saved.${rf.tolerances?'':' Import the Min/Max file in Data workspace to enable minimums.'}${rf.bom?'':' Import the BOM file in Data workspace for BOM-based rates.'}</p></div><div class="table-wrap"><table class="workbook-table rate-table"><thead><tr><th>MATERIAL</th><th>SUPERMARKET</th><th>BIN</th><th>STOCK</th><th>MIN</th><th>MAX</th><th>FILL %</th><th>REPLEN / DAY (EST.)</th><th>BOM / DAY (EST.)</th><th>DAYS TO MIN</th><th>STATUS</th><th><span class="sr-only">Scenario</span></th></tr></thead><tbody id="workbook-inventory"></tbody></table></div><div class="table-foot insights-footer"><span id="workbook-count"></span><div><button id="workbook-prev">← Previous</button> <button id="workbook-next">Next →</button></div></div><div class="card-body"><p class="analysis-note" style="margin-top:0">Replen / day is an estimate from confirmed replenishment transfer targets; BOM / day is an estimate from completed orders × BOM quantities (blank when the part is shared between bins or absent from the BOM). Days to min = (stock − min) ÷ rate. Neither rate is a validated forecast; both assume consistent count units and no other receipts or uses. The averaging window is ${shortDate(t.window_start)} through ${shortDate(t.window_end)}. ${num(t.matched_events)} transfers match one stock position; ${num(t.unmatched_events)} are unmatched and ${num(t.ambiguous_events)} have ambiguous matches.</p></div></div>
  <div class="two-col"><div class="card"><div class="card-head"><div><h2>Historical production activity</h2><p class="subtitle">Station events by month · not finished-unit output</p></div></div><div class="card-body">${miniBars(p.monthly,'events','Monthly historical production station events')}<div class="summary-grid"><div><small>STATION EVENTS</small><strong>${num(p.events)}</strong></div><div><small>DISTINCT ORDERS</small><strong>${num(p.distinct_orders)}</strong></div><div><small>ON-HOLD EVENTS</small><strong>${num(p.held_events)}</strong></div></div><h3 style="margin-top:6px">Completed orders per week</h3>${(p.completed_orders_weekly||[]).length?miniBars(p.completed_orders_weekly.slice(-12),'orders','Completed production orders per week'):'<p class="hint">No completed-order history in this analysis.</p>'}${statuses.length?`<p class="analysis-note" style="margin-top:0">Order rows by status: ${statuses.map(([c,v])=>esc(c)+' '+esc(v&&v.label)+' ('+num(v&&v.rows)+')').join(' · ')}.</p>`:''}<p class="analysis-note">${num(p.passed_events)} passed station events. A production order can have many events. ${num(p.undated_events)} undated events are excluded from the chart. On-hold status does not establish a material shortage or downtime cause.</p></div></div><div class="card"><div class="card-head"><div><h2>Planned workload</h2><p class="subtitle">Sales-order line rows by planned start month</p></div></div><div class="card-body">${miniBars(s.monthly,'count','Planned sales-order line rows by month','#548caa')}<div class="summary-grid"><div><small>SOURCE LINE ROWS</small><strong>${num(s.source_rows)}</strong></div><div><small>UNIQUE LINE + DATE</small><strong>${num(s.unique_lines_by_date)}</strong></div><div><small>VALID DATES</small><strong>${num(s.dated_rows)}</strong></div></div><h3 style="margin-top:6px">Planned lines per week</h3>${(s.weekly||[]).length?miniBars(s.weekly.slice(-12),'lines','Planned sales-order lines per week','#548caa')+`<p class="analysis-note" style="margin-top:0">${num((s.weekly||[]).reduce((x,r)=>x+(r.bom_lines||0),0))} of ${num((s.weekly||[]).reduce((x,r)=>x+(r.lines||0),0))} weekly lines match a BOM item.</p>`:'<p class="hint">Weekly planned lines are not available for this cached analysis.</p>'}<p class="analysis-note">Line counts are not product quantities or material demand. Source rows are preserved in this chart; repeated order/line/date records are counted in the unique total separately. Line counts alone do not give material use; BOM-implied demand is shown in the inventory table as an estimate.</p></div></div></div>
  <div class="two-col"><div class="card"><div class="card-head"><h2>Most active stations</h2><span class="pill">Historical events</span></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>STATION</th><th>EVENTS</th><th>ON HOLD</th><th>MEDIAN PASSED TIME</th></tr></thead><tbody>${p.stations.slice(0,6).map(r=>`<tr><td><strong>${esc(r.name)}</strong><small>${esc(r.workcenter)}</small></td><td>${num(r.events)}</td><td>${pct(r.hold_share)}</td><td>${num(r.median_passed_minutes,1)} min</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-head"><h2>Frequent transfer materials</h2><span class="pill">Latest ${t.window_days} days</span></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>MATERIAL</th><th>CONFIRMED EVENTS</th></tr></thead><tbody>${t.frequent_materials.slice(0,6).map(r=>`<tr><td>${esc(r.material)}</td><td>${num(r.events)}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="card"><div class="card-head"><h2>What this demo establishes</h2><span class="pill">Source SHA-256 ${esc(a.source_checksum.slice(0,12))}…</span></div><div class="card-body"><ul class="analysis-assumptions">${a.assumptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="analysis-note">Analytics version ${esc(a.version)} · Stored with the source checksum. Saved what-if scenarios: ${a.scenarios.length}. Imported values remain unchanged.</p></div></div>`;
}
function workbookScenarioForm(a){
 const eligible=a.inventory.filter(r=>r.scenario_eligible&&r.target_quantity_per_day>0).sort((x,y)=>y.window_transfer_events-x.window_transfer_events);
 if(!eligible.length)return '<p class="subtitle">This workbook has no unambiguous count-unit positions with valid stock and positive transfer activity. Descriptive charts and stock review are still available.</p>';
 const last=a.scenarios[0],cur=eligible.find(r=>r.id===last?.position_id)||eligible[0],minVal=cur.min!=null?cur.min:(last?.minimum_stock??0);return `<p class="analysis-note" style="margin-top:0">If use equaled confirmed transfer target volume, how long would the snapshot balance last? Adjust the assumptions below. This assumes targets equal received quantities, then assumes receipts equal use. Neither is verified.</p><form id="workbook-scenario-form" class="workbook-form"><label for="workbook-position">Material / stock position</label><select id="workbook-position" name="position_id">${eligible.map(r=>`<option value="${r.id}" ${cur.id===r.id?'selected':''}>${esc(r.material)} · ${esc(r.bin)} (${num(r.stock)} ${esc(r.unit)})</option>`).join('')}</select><div class="form-grid"><div><label for="usage-multiplier">Assumed usage multiplier</label><input id="usage-multiplier" name="usage_multiplier" type="number" min="0.1" max="5" step="0.1" value="${last?.usage_multiplier??1}" required></div><div><label for="minimum-stock">Assumed minimum stock (from Min/Max when imported)</label><input id="minimum-stock" name="minimum_stock" type="number" min="0" max="1000000" step="1" value="${minVal}" required></div><div><label for="scenario-lead">Warning horizon (h)</label><input id="scenario-lead" name="lead_hours" type="number" min="0.1" max="168" step="0.1" value="${last?.lead_hours??horizonOf(a)}" required></div></div><button type="submit" class="primary">Calculate & save scenario</button></form><div id="workbook-scenario-result">${last?scenarioResult(last):'<p class="analysis-note">Choose a position and save a scenario to see the estimate. No production alert will be sent.</p>'}</div>`;
}
function scenarioResult(r){return `<div class="scenario-result"><div class="eyebrow">ASSUMPTION-BASED RESULT</div><div class="result-value">${hours(r.assumed_hours_to_minimum)}</div><p>To the assumed minimum, starting from the undated snapshot.</p><p><strong>${esc(r.material)} · ${esc(r.bin)}</strong><br>${num(r.snapshot_stock)} ${esc(r.unit)} starting stock · ${num(r.assumed_consumption_per_day,2)} ${esc(r.unit)}/day assumed use<br>${r.within_assumed_lead?'Inside':'Outside'} the ${num(r.lead_hours,1)}h warning horizon.</p><p class="analysis-note">Assumes targets were received and use follows target quantity × ${num(r.usage_multiplier,1)}, quantities share the bin unit, and no new receipts arrive. No calendar depletion date is assigned. Saved locally; source stock is unchanged.</p></div>`}
function workbookRows(){
 const a=state.insights,hz=horizonOf(a),q=workbookSearch.toLowerCase();
 const all=a.inventory.map(r=>[r,riskOf(r,hz)]).filter(([r,k])=>[r.material,r.name,r.bin,r.supermarket].join(' ').toLowerCase().includes(q)&&(workbookFilter==='all'||workbookFilter==='below'&&k==='Below min'||workbookFilter==='within'&&k==='Within horizon'||workbookFilter==='notol'&&(!r.tolerance_flag||r.tolerance_flag==='missing'))).sort((x,y)=>riskRank[x[1]]-riskRank[y[1]]||(x[0].days_to_min_replen??1e12)-(y[0].days_to_min_replen??1e12)||String(x[0].material).localeCompare(String(y[0].material)));
 const pages=Math.max(1,Math.ceil(all.length/50));workbookPage=Math.min(workbookPage,pages-1);const rows=all.slice(workbookPage*50,(workbookPage+1)*50);
 const flag={zero_min:'zero minimum',invalid:'min > max',max_not_set:'max not set',missing:'no tolerance'};
 $('#workbook-inventory').innerHTML=rows.length?rows.map(([r,k])=>`<tr><td><strong>${esc(r.name)}</strong><small>${esc(r.material)}</small></td><td>${esc(r.supermarket??'—')}</td><td>${esc(r.storage_type)} / ${esc(r.bin)}</td><td><strong class="${r.stock===0?'red':''}">${num(r.stock,2)} ${esc(r.unit)}</strong></td><td>${num(r.min,2)}${r.tolerance_flag&&r.tolerance_flag!=='ok'?`<small>${esc(flag[r.tolerance_flag]||r.tolerance_flag)}</small>`:''}</td><td>${num(r.max,2)}</td><td>${r.fill_pct==null?'—':num(r.fill_pct,0)+'%'}</td><td>${r.replen_qty_per_day==null?'—':num(r.replen_qty_per_day,2)}</td><td>${r.bom_qty_per_day==null?'—':num(r.bom_qty_per_day,2)}${r.bom_status&&r.bom_status!=='ok'?`<small>${esc(String(r.bom_status).replaceAll('_',' '))}</small>`:''}</td><td>${r.days_to_min_replen==null?'—':num(r.days_to_min_replen,1)+'d'}${r.days_to_min_bom==null?'':`<small>BOM: ${num(r.days_to_min_bom,1)}d</small>`}</td><td><span class="badge ${riskClass[k]}">${esc(k)}</span></td><td>${r.scenario_eligible?`<button class="small" data-workbook-position="${esc(r.id)}">What-if</button>`:'<span class="pill">No proxy</span>'}</td></tr>`).join(''):'<tr><td colspan="12" class="empty">No positions match these filters.</td></tr>';
 $('#workbook-count').textContent=`${num(all.length)} matching positions · Page ${workbookPage+1} of ${pages} · Up to 50 rows per page`;
 $('#workbook-prev').disabled=workbookPage===0;$('#workbook-next').disabled=workbookPage>=pages-1;
 const c=k=>a.inventory.filter(r=>riskOf(r,hz)===k).length;if($('#tile-below'))$('#tile-below').textContent=num(c('Below min'));if($('#tile-within'))$('#tile-within').textContent=num(c('Within horizon'));
}
function bindWorkbook(){
 if(!$('#workbook-inventory'))return;
 $('#workbook-filter').value=workbookFilter;workbookRows();
 $('#workbook-horizon').addEventListener('input',e=>{const v=e.target.value===''?NaN:Number(e.target.value);if(Number.isFinite(v)&&v>=0){workbookHorizon=v;workbookPage=0;workbookRows()}});
 $('#workbook-search').addEventListener('input',e=>{workbookSearch=e.target.value;workbookPage=0;workbookRows()});
 $('#workbook-filter').addEventListener('change',e=>{workbookFilter=e.target.value;workbookPage=0;workbookRows()});
 $('#workbook-prev').addEventListener('click',()=>{workbookPage--;workbookRows()});$('#workbook-next').addEventListener('click',()=>{workbookPage++;workbookRows()});
 $('#workbook-inventory').addEventListener('click',e=>{const b=e.target.closest('[data-workbook-position]');if(b){$('#workbook-position').value=b.dataset.workbookPosition;$('#workbook-position').dispatchEvent(new Event('change'));$('#workbook-position').scrollIntoView({behavior:'smooth',block:'center'});$('#workbook-position').focus()}});
 if($('#workbook-position'))$('#workbook-position').addEventListener('change',e=>{const r=state.insights.inventory.find(x=>x.id===e.target.value);if(r&&r.min!=null)$('#minimum-stock').value=r.min});
 if($('#workbook-scenario-form'))$('#workbook-scenario-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;const requestedDataset=dataset;const fields=Object.fromEntries(new FormData(e.target));try{const result=await api('/api/workbook-scenario',{dataset:requestedDataset,position_id:fields.position_id,usage_multiplier:Number(fields.usage_multiplier),minimum_stock:Number(fields.minimum_stock),lead_hours:Number(fields.lead_hours)});if(dataset===requestedDataset&&state.dataset.id===requestedDataset){state.insights.scenarios.unshift(result);const panel=$('#workbook-scenario-result');if(panel)panel.innerHTML=scenarioResult(result)}toast('Workbook scenario saved. Source data is unchanged.')}catch(err){toast(err.message,true)}finally{button.disabled=false}});
}
async function safeLoad(){try{await load()}catch(e){toast(e.message,true)}}
load().catch(e=>{$('#notice').textContent='The local backend is not connected.';$('#content').innerHTML='<div class="card"><div class="empty"><strong>Start the local workspace</strong>Run <code>.venv/bin/python server.py</code> from the repository, then open <a href="http://127.0.0.1:8765">http://127.0.0.1:8765</a>.<br>This single HTML interface uses the Python backend to persist data.</div></div>';toast(e.message,true)});

<style>

@media(max-width:720px){.pf-input{grid-template-columns:76px minmax(0,1fr)}.pf-input span{grid-column:1/-1;margin-top:-4px}.pf-name{font-size:32px}.pf-kpi strong{font-size:34px}.pf-kpis{gap:10px}.pf-kpi{padding:14px}.pf-card{padding:16px}}
</style>
<script>
'use strict';
// ---- Part forecast. The scenario model mirrors proactive.blend_rate/project; "Save" writes the savable parts to the server.
const PF={key:null,scen:null,q:'',open:false,active:-1,ds:null,widths:{}};
const PF_STATUS={'Below min':'Below','Predicted':'Predicted','OK':'OK'};
const pfH=h=>h==null?'—':h<48?`${num(h,1)} h`:`${num(h/24,1)} d`;
const pfN=(v,d=1)=>v==null?'—':num(v,d);
const pfClone=o=>JSON.parse(JSON.stringify(o));

function fcBlend(inp,w,div){
 const live={};for(const n of ['history','schedule','observed']){const r=inp?.[n];if((w[n]||0)>0&&typeof r==='number'&&isFinite(r)&&r>=0)live[n]=r}
 const dropped=[];if('history' in live&&'schedule' in live&&live.history>0&&Math.abs(live.schedule-live.history)/live.history*100>div){delete live.history;dropped.push('history')}
 const used=['history','schedule','observed'].filter(n=>n in live),tw=used.reduce((s,n)=>s+w[n],0);
 return {rate:used.length?used.reduce((s,n)=>s+w[n]*live[n],0)/tw:null,used,dropped,live}}
function pfBase(p){const s=stockData.forecast.settings;return {cls:p.lead_class||'stocked',leads:{stocked:s.lead_hours_stocked,fab:s.lead_hours_fab},safety:s.safety_hours,mode:'model',mult:1,custom:null,available:p.available,min:p.min,max:p.max,weights:pfClone(s.weights),divergence:s.divergence_pct}}
function pfCalc(p,sc){
 const b=fcBlend(p.demand_inputs,sc.weights,sc.divergence),model=b.rate,rate=sc.mode==='custom'?sc.custom:model==null?null:model*sc.mult,lead=sc.leads[sc.cls],thr=lead+sc.safety,strict=stockData.channels.rule==='below';
 let status,hours=null,suggest=null;
 if(sc.min==null)status='No tolerance';else if(sc.available==null)status='No stock';else if(strict?sc.available<sc.min:sc.available<=sc.min){status='Below min';hours=0}else if(!rate)status='No rate';else{hours=Math.max(0,sc.available-sc.min)/rate*24;status=hours<=thr?'Predicted':'OK'}
 if((status==='Below min'||status==='Predicted')&&sc.max!=null&&sc.max>0)suggest=Math.max(0,Math.ceil(sc.max-(sc.available-(rate||0)*lead/24)));
 return {b,model,rate,lead,thr,status,hours,suggest,orderIn:hours==null?null:hours-thr}}
function pfPart(){return stockData.positions.find(p=>p.key===PF.key)}
function pfRank(p){return p.forecast==='below_min'?0:p.status==='Predicted'?1:p.hours_to_min!=null?2:3}
function pfDefault(){const o=p=>p.status==='Predicted'?0:p.forecast==='ok'?1:p.forecast==='below_min'&&p.demand_per_day?2:3;return stockData.positions.slice().sort((a,b)=>o(a)-o(b)||(a.hours_to_min??1e12)-(b.hours_to_min??1e12))[0]?.key}
function pfSync(){
 if(PF.ds!==dataset){Object.assign(PF,{ds:dataset,key:initialParams.get('part')||null,scen:null,q:''})}
 if(!pfPart())PF.key=pfDefault();const p=pfPart();if(!p)return;
 if(!PF.scen||PF.scen.key!==p.key||PF.fresh)PF.scen={key:p.key,...pfBase(p)};PF.fresh=false}
function pfLabel(s){return s==='Below min'?'Below minimum':s==='No rate'?'No demand rate':s==='No tolerance'?'No minimum set':s==='No stock'?'No stock reading':s}
function pfStatusPill(s){return `<span class="pf-status ${PF_STATUS[s]||'None'}" id="pf-status">${esc(pfLabel(s))}</span>`}
function pfBadge(p){const s=p.forecast==='below_min'?['Alert','Below min']:p.status==='Predicted'?['Predicted','Predicted']:p.status==='OK'?['OK',p.hours_to_min!=null?pfH(p.hours_to_min):'OK']:['No','—'];return `<span class="badge ${s[0]}">${esc(s[1])}</span>`}

// ---- picker
function pfMatches(){
 const q=PF.q.trim().toLowerCase(),ps=stockData.positions;
 if(!q){const risk=ps.filter(p=>pfRank(p)<=1).sort((a,b)=>pfRank(b)-pfRank(a)||(a.hours_to_min??0)-(b.hours_to_min??0)).slice(0,8),soon=ps.filter(p=>pfRank(p)===2).sort((a,b)=>a.hours_to_min-b.hours_to_min).slice(0,8);return [['Predicted and below minimum',risk],['Closest to minimum',soon]]}
 const hit=ps.filter(p=>`${p.material} ${p.description} ${p.bin} ${p.supermarket}`.toLowerCase().includes(q)).sort((a,b)=>(a.material.toLowerCase().startsWith(q)?0:1)-(b.material.toLowerCase().startsWith(q)?0:1)||pfRank(a)-pfRank(b)).slice(0,40);
 return [[`${hit.length===40?'First 40':hit.length} match${hit.length===1?'':'es'}`,hit]]}
function pfResults(){
 const groups=pfMatches();PF.list=groups.flatMap(g=>g[1]);let i=-1;
 return groups.map(([h,ps])=>ps.length?`<li class="head" role="presentation">${esc(h)}</li>`+ps.map(p=>{i++;return `<li role="option" id="pf-opt-${i}" data-key="${esc(p.key)}" aria-selected="${i===PF.active}"><div><b>${esc(p.material)}</b><small>${esc(p.description||'')} · ${esc(p.supermarket||'—')} ${esc(p.bin)}</small></div>${pfBadge(p)}</li>`}).join(''):'').join('')||'<li class="head">No parts match.</li>'}
function pfOpen(open){PF.open=open;const r=$('#pf-results');if(!r)return;r.hidden=!open;$('#pf-search').setAttribute('aria-expanded',open);if(open){r.innerHTML=pfResults()}}
function pfChoose(key){PF.key=key;PF.scen=null;PF.q='';PF.open=false;render()}

// ---- chart
function pfChart(p,c,sc){
 if(c.rate==null&&c.status!=='Below min')return '<div class="empty"><strong>No demand rate</strong>This part has no replenishment history, no BOM schedule demand, and no observed depletion, so its stock cannot be projected. Set a custom consumption in the panel to explore a scenario.</div>';
 const rate=c.rate||0,W=Math.max(320,PF.widths.chart||760),L=52,R=18,T=18,H=Math.round(Math.min(380,Math.max(260,W*.45))),y0=H-40;
 const Hh=Math.max(24,Math.min(240,Math.ceil(Math.max(c.thr*2,(c.hours||0)*1.4,8)))),stockAt=t=>Math.max(0,sc.available-rate*t/24),order=t=>t<c.lead?stockAt(t):Math.max(0,sc.available+(c.suggest||0)-rate*t/24);
 const top=Math.max(sc.max||0,sc.available+(c.suggest||0),sc.min||0,1)*1.12,yt=pfTicks(top,5),x=t=>L+t/Hh*(W-L-R),y=v=>y0-v/yt[yt.length-1]*(y0-T),xt=pfTicks(Hh,Math.max(3,Math.floor((W-L-R)/90))).filter(v=>v<=Hh);
 const line=f=>Array.from({length:121},(_,i)=>i*Hh/120).map((t,i)=>`${i?'L':'M'}${x(t).toFixed(1)},${y(f(t)).toFixed(1)}`).join('');
 const win=Math.min(c.thr,Hh);PF.chart={x,y,Hh,L,R,W,T,y0,stockAt,order,c,sc};
 const breach=c.hours!=null&&c.hours<=Hh&&sc.min!=null?`<circle cx="${x(c.hours)}" cy="${y(sc.min)}" r="6" fill="${c.status==='Below min'?'var(--red)':'var(--series-1)'}" stroke="#fff" stroke-width="2"/><text class="lbl halo" x="${Math.min(x(c.hours)+10,W-R-150)}" y="${y(sc.min)-12}">${c.status==='Below min'?'At or below minimum now':'Reaches minimum in '+pfH(c.hours)}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected stock for ${esc(p.material)}: ${c.status==='Below min'?'below minimum now':'reaches minimum in '+pfH(c.hours)}">
 <rect x="${x(0)}" y="${T}" width="${x(win)-x(0)}" height="${y0-T}" fill="#f1f6f6"/><text x="${x(0)+8}" y="${T+16}">Lead time + buffer · ${num(c.thr,1)} h</text>
 ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`).join('')}
 ${xt.map(v=>`<text x="${x(v)}" y="${y0+18}" text-anchor="middle">${v} h</text>`).join('')}<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>
 ${sc.max?`<line x1="${L}" x2="${W-R}" y1="${y(sc.max)}" y2="${y(sc.max)}" stroke="#98a4b0" stroke-dasharray="5 4"/><text class="halo" x="${W-R}" y="${y(sc.max)-6}" text-anchor="end">Max ${num(sc.max)}</text>`:''}
 ${sc.min!=null?`<line x1="${L}" x2="${W-R}" y1="${y(sc.min)}" y2="${y(sc.min)}" stroke="var(--red)" stroke-dasharray="5 4"/><text class="halo" x="${W-R}" y="${y(sc.min)+16}" text-anchor="end" style="fill:var(--red)">Min ${num(sc.min)}</text>`:''}
 ${c.suggest?`<path d="${line(order)}" fill="none" stroke="var(--series-2)" stroke-width="2.5" stroke-dasharray="7 5"/>`:''}<path d="${line(stockAt)}" fill="none" stroke="var(--series-1)" stroke-width="2.5"/>${breach}
 <line id="pf-cross" x1="0" x2="0" y1="${T}" y2="${y0}" stroke="#98a4b0" visibility="hidden"/><rect id="pf-hit" x="${L}" y="${T}" width="${W-L-R}" height="${y0-T}" fill="transparent"/>
 <text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">Hours from now</text></svg>
 <div class="pf-legend"><span><i style="border-color:var(--series-1)"></i>Projected stock, no order</span>${c.suggest?`<span><i style="border-color:var(--series-2);border-top-style:dashed"></i>Order ${num(c.suggest)} now (arrives in ${num(c.lead,1)} h)</span>`:''}<span><i style="border-color:var(--red);border-top-style:dashed"></i>Minimum</span></div>
 <details class="pf-table"><summary>Show as table</summary><div class="table-wrap"><table><thead><tr><th>Hour</th><th>Projected stock</th>${c.suggest?'<th>With order now</th>':''}</tr></thead><tbody>${Array.from({length:Math.min(Hh,96)+1},(_,t)=>`<tr><td>${t}</td><td>${num(stockAt(t),1)}</td>${c.suggest?`<td>${num(order(t),1)}</td>`:''}</tr>`).join('')}</tbody></table></div></details>`}
function pfTicks(max,n){const raw=max/n,mag=10**Math.floor(Math.log10(raw||1)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag;const out=[];for(let v=0;v<max+step*.999;v+=step)out.push(+v.toPrecision(12));return out}

// ---- breakdown
function pfBreakdown(p,c,sc){
 const names={history:'History',schedule:'Schedule',observed:'Observed'},desc={history:'replenishment transfers into this bin, per day',schedule:'next 30 days of planned lines × BOM qty ÷ 30',observed:'drops between dated stock snapshots'},inp=p.demand_inputs||{},mx=Math.max(1e-9,...Object.values(inp).filter(v=>v!=null));
 const rows=Object.keys(names).map(k=>{const v=inp[k],w=sc.weights[k],used=c.b.used.includes(k),why=v==null?'no data':c.b.dropped.includes(k)?`dropped — schedule differs by ${num(Math.abs(inp.schedule-inp.history)/inp.history*100,0)}% (> ${num(sc.divergence,0)}%)`:!(w>0)?'weight 0 — ignored':used?`weight ${num(w,1)}`:'not used';return `<div class="pf-input ${used?'':'off'}"><b>${names[k]}</b><div class="track">${v!=null?`<i style="width:${Math.max(2,v/mx*100)}%"></i>`:''}</div><span>${v==null?'—':num(v,2)+' /day'} <em>· ${esc(why)}</em></span></div>`}).join('');
 const used=c.b.used,eq=used.length?(used.length===1?`${names[used[0]]} = ${num(c.b.live[used[0]],2)} /day`:`(${used.map(k=>`${num(sc.weights[k],1)} × ${num(c.b.live[k],2)}`).join(' + ')}) ÷ ${num(used.reduce((s,k)=>s+sc.weights[k],0),1)} = ${num(c.model,2)} /day`):'no inputs → no model rate';
 const adj=sc.mode==='custom'?`custom consumption = ${pfN(sc.custom,2)} /day`:c.model==null?'—':sc.mult===1?`no adjustment → ${num(c.rate,2)} /day`:`${num(c.model,2)} × ${num(sc.mult,2)} = ${num(c.rate,2)} /day`;
 const hrs=c.status==='Below min'?`available ${num(sc.available)} ${stockData.channels.rule==='below'?'<':'≤'} min ${num(sc.min)} → already at the minimum`:c.rate?`(${num(sc.available)} − ${num(sc.min)}) ÷ ${num(c.rate,2)} × 24 = ${pfH(c.hours)}`:'no rate → cannot project';
 const cmp=c.hours==null?'—':`${pfH(c.hours)} ${c.hours<=c.thr?'≤':'>'} ${num(c.lead,1)} h lead + ${num(sc.safety,1)} h buffer = ${num(c.thr,1)} h → ${pfLabel(c.status)}`;
 const sug=c.suggest==null?'only suggested when the part is below minimum or predicted':`⌈${num(sc.max)} − (${num(sc.available)} − ${num(c.rate||0,2)} × ${num(c.lead,1)} ÷ 24)⌉ = ${num(c.suggest)}`;
 return `<ol class="pf-steps">
 <li><div><h3>Demand inputs</h3><p>Each input is a per-day quantity. History is a proxy for consumption, not measured usage.</p><div class="pf-inputs">${rows}</div><div class="pf-eq">${esc(eq)}</div></div></li>
 <li><div><h3>Consumption used</h3><p>${sc.mode==='custom'?'A custom rate replaces the model.':'The model rate times the consumption multiplier.'}</p><div class="pf-eq">${esc(adj)}</div></div></li>
 <li><div><h3>Hours to minimum</h3><p>Stock above the minimum divided by hourly consumption.</p><div class="pf-eq">${hrs}</div></div></li>
 <li><div><h3>Compare with lead time</h3><p>Predicted when the minimum arrives before a replenishment could (${esc(sc.cls)} lead time plus buffer).</p><div class="pf-eq">${esc(cmp)}</div></div></li>
 <li><div><h3>Suggested order</h3><p>Refill to the maximum, allowing for consumption during the lead time.</p><div class="pf-eq">${esc(sug)}</div></div></li></ol>`}

// ---- controls
const PF_CTL={lead:['Lead time (h)',0,72,.5],safety:['Safety buffer (h)',0,24,.5],mult:['Consumption multiplier (×)',0,5,.05],custom:['Custom consumption (/day)',0,null,.1],available:['Available stock',0,null,1],min:['Minimum',0,null,1],max:['Maximum',0,null,1],'w.history':['History weight',0,10,.1],'w.schedule':['Schedule weight',0,10,.1],'w.observed':['Observed weight',0,10,.1],divergence:['Divergence threshold (%)',0,300,5]};
function pfVal(sc,k){return k==='lead'?sc.leads[sc.cls]:k.startsWith('w.')?sc.weights[k.slice(2)]:sc[k]}
function pfSetVal(sc,k,v){if(k==='lead')sc.leads[sc.cls]=v;else if(k.startsWith('w.'))sc.weights[k.slice(2)]=v;else sc[k]=v}
function pfCtl(k,sc,base,hint=''){
 const [label,lo,hi0,st]=PF_CTL[k],v=pfVal(sc,k),hi=hi0??Math.max(10,Math.ceil(Math.max(base.max||0,base.available||0,sc.max||0,v||0)*1.5)),changed=JSON.stringify(v)!==JSON.stringify(pfVal(base,k));
 return `<div class="pf-ctl ${changed?'changed':''}" data-ctl="${k}"><div class="top"><label for="pf-${k}">${label}</label><input type="number" id="pf-${k}" data-pf="${k}" min="${lo}" ${hi0!=null?`max="${hi0}"`:''} step="${st}" value="${v??''}"></div><input type="range" data-pf="${k}" min="${lo}" max="${hi}" step="${st}" value="${v??0}" aria-label="${label} slider">${hint?`<div class="hint" id="pf-hint-${k}">${hint}</div>`:''}</div>`}
function pfChanges(p,sc){
 const s=stockData.forecast.settings,base=pfBase(p),out=[];
 if(sc.leads.stocked!==s.lead_hours_stocked)out.push(['settings',`Stocked lead time → ${num(sc.leads.stocked,1)} h (all stocked parts)`]);
 if(sc.leads.fab!==s.lead_hours_fab)out.push(['settings',`Fab lead time → ${num(sc.leads.fab,1)} h (all fab parts)`]);
 if(sc.safety!==s.safety_hours)out.push(['settings',`Safety buffer → ${num(sc.safety,1)} h (all parts)`]);
 if(JSON.stringify(sc.weights)!==JSON.stringify(s.weights)||sc.divergence!==s.divergence_pct)out.push(['settings','Model weights / divergence (all parts)']);
 if(sc.cls!==base.cls)out.push(['class',`This part's lead class → ${sc.cls}`]);
 if(sc.available!==base.available)out.push(['reading',`Record stock reading ${num(sc.available)} for this part`]);
 const whatif=[];if(sc.mode!=='model'||sc.mult!==1)whatif.push('consumption');if(sc.min!==base.min||sc.max!==base.max)whatif.push('min / max');
 return {save:out,whatif}}
function pfMultHint(c,sc){return c.model==null?'No model rate for this part.':`${num(c.model,2)} /day × ${num(sc.mult,2)} = <b>${num(c.rate,2)} /day</b>`}
function pfSaveBox(p,sc){const ch=pfChanges(p,sc);return `${ch.save.length?`<ul>${ch.save.map(x=>`<li>${esc(x[1])}</li>`).join('')}</ul>`:'<p>No savable changes.</p>'}${ch.whatif.length?`<p>What-if only, not saved: ${esc(ch.whatif.join(', '))}.</p>`:''}<div class="row"><button type="button" data-pf-act="reset" ${ch.save.length||ch.whatif.length?'':'disabled'}>Reset</button><button type="button" class="primary" data-pf-act="save" ${ch.save.length?'':'disabled'}>Save</button></div>`}
function pfSide(p,c,sc){
 const base=pfBase(p);
 return `<section class="pf-side" aria-label="Forecast controls"><header><h2>Configure</h2><p>Changes preview instantly. Nothing is saved until you press Save.</p></header>
 <section class="pf-sec"><h3>Lead time</h3><div class="pf-seg" role="group" aria-label="Lead class"><button type="button" data-cls="stocked" aria-pressed="${sc.cls==='stocked'}">Stocked item</button><button type="button" data-cls="fab" aria-pressed="${sc.cls==='fab'}">Built in fab</button></div>${pfCtl('lead',sc,base,`Time from request to the part being stocked in the supermarket (${esc(sc.cls)} parts).`)}${pfCtl('safety',sc,base)}</section>
 <section class="pf-sec"><h3>Consumption</h3><div class="pf-seg" role="group" aria-label="Consumption source"><button type="button" data-mode="model" aria-pressed="${sc.mode==='model'}">From model</button><button type="button" data-mode="custom" aria-pressed="${sc.mode==='custom'}">Custom rate</button></div>
 ${sc.mode==='model'?pfCtl('mult',sc,base,pfMultHint(c,sc)):pfCtl('custom',sc,base,'Units consumed per day.')}</section>
 <section class="pf-sec"><h3>Stock and tolerance</h3>${pfCtl('available',sc,base,p.overridden?'Currently a simulated reading.':'From the latest snapshot.')}${pfCtl('min',sc,base)}${pfCtl('max',sc,base)}</section>
 <details class="pf-sec" ${PF.adv?'open':''} id="pf-adv"><summary>Model weights</summary>${pfCtl('w.history',sc,base)}${pfCtl('w.schedule',sc,base)}${pfCtl('w.observed',sc,base)}${pfCtl('divergence',sc,base,'History is dropped when schedule differs from it by more than this.')}</details>
 <div class="pf-save" id="pf-savebox">${pfSaveBox(p,sc)}</div></section>`}

// ---- page
function forecastView(){
 const h=head('PART FORECAST','Part forecast','Pick a part to see when it reaches its minimum, why, and what to order. Adjust any input on the right.');
 if(state.dataset.kind!=='workbook')return h+`<div class="card"><div class="empty"><strong>Select a manufacturing workbook</strong>The part forecast needs an imported workbook with a Min/Max file attached.${datasets.filter(d=>d.kind==='workbook').map(d=>`<button data-dataset="${esc(d.id)}">${esc(d.name)}</button>`).join('')}</div></div>`;
 if(stockFor!==dataset||!stockData){loadStock();return h+'<div class="card"><div class="empty">Loading parts…</div></div>'}
 if(stockData.error)return h+`<div class="card"><div class="empty"><strong>Forecast unavailable</strong>${esc(stockData.error)}</div></div>`;
 pfSync();const p=pfPart();
 const picker=`<div class="pf-picker"><label for="pf-search">Part</label><input id="pf-search" class="pf-search" type="search" role="combobox" aria-expanded="false" aria-controls="pf-results" aria-autocomplete="list" autocomplete="off" placeholder="Search part number, description, or bin" value="${esc(PF.q)}"><ul id="pf-results" class="pf-results" role="listbox" hidden></ul></div>`;
 if(!p)return h+picker+'<div class="card"><div class="empty"><strong>No parts</strong>The selected workbook has no stock positions.</div></div>';
 return h+`<div class="pf">${picker}<div id="pf-body">${pfBody(p)}</div></div><div class="pf-tip" id="pf-tip" hidden></div>`}
function pfBody(p,part){
 const sc=PF.scen,c=pfCalc(p,sc),alert=stockData.open_alerts.find(a=>a.position===p.key),base=pfBase(p),ch=pfChanges(p,sc),scen=ch.save.length||ch.whatif.length;
 const fill=sc.max>0&&sc.available!=null?Math.min(100,sc.available/sc.max*100):null,minAt=sc.max>0&&sc.min!=null?Math.min(100,sc.min/sc.max*100):null;
 const kAvail=`<div class="pf-kpi ${c.status==='Below min'?'alarm':''}"><small>Available now</small><strong id="pf-k-available">${pfN(sc.available,0)}<em>${esc(p.unit||'')}</em></strong>${fill!=null?`<div class="pf-gauge" aria-hidden="true"><i style="width:${fill}%"></i>${minAt!=null?`<b style="left:${minAt}%"></b>`:''}</div>`:''}<span>min ${pfN(sc.min,0)} · max ${pfN(sc.max,0)}</span></div>`;
 const kHours=`<div class="pf-kpi ${c.status==='Below min'?'alarm':c.status==='Predicted'?'warn':''}"><small>Time to minimum</small><strong id="pf-k-hours">${c.status==='Below min'?'Now':pfH(c.hours)}</strong><span>${c.hours==null?pfLabel(c.status):c.status==='Below min'?'already at or below minimum':`lead time + buffer ${num(c.thr,1)} h`}</span></div>`;
 const kRate=`<div class="pf-kpi"><small>Consumption</small><strong id="pf-k-rate">${pfN(c.rate,1)}<em>/day</em></strong><span>${sc.mode==='custom'?'custom rate':c.b.used.length?'from '+c.b.used.join(' + '):'no demand inputs'}${sc.mode==='model'&&sc.mult!==1?` × ${num(sc.mult,2)}`:''}</span></div>`;
 const kOrder=`<div class="pf-kpi ${(c.orderIn!=null&&c.orderIn<=0)||c.status==='Below min'?'alarm':''}"><small>Order</small><strong id="pf-k-order">${c.suggest!=null?num(c.suggest):c.orderIn!=null?(c.orderIn<=0?'Now':pfH(c.orderIn)):c.status==='Below min'?'Now':'—'}${c.suggest!=null?'<em>units now</em>':''}</strong><span>${c.suggest!=null?'to refill to max before minimum':c.orderIn!=null?(c.orderIn<=0?'order is due':'until an order must be placed'):c.status==='Below min'?'order is due (max not set)':'no projection'}</span></div>`;
 const hero=`<div class="pf-hero"><div style="min-width:0"><h2 class="pf-name" id="pf-name">${esc(p.material)}</h2><div class="pf-desc">${esc(p.description||'No description')}</div><div class="pf-meta"><span>Supermarket <b>${esc(p.supermarket||'—')}</b></span><span>Bin <b>${esc(p.bin)}</b></span><span>Lead class <b>${esc(sc.cls)}</b></span>${p.note?`<span>${esc(p.note)}</span>`:''}</div>${scen?'<div class="pf-scen">● Scenario — values differ from the saved data</div>':''}</div>${pfStatusPill(c.status)}</div>`;
 const main=`<div class="pf-kpis">${kAvail}${kHours}${kRate}${kOrder}</div>
 <section class="pf-card"><header><h2>Projected stock</h2><p>${c.rate?`${num(c.rate,1)} per day over the next hours`:'—'}</p></header><div class="pf-chart" id="pf-chart">${pfChart(p,c,sc)}</div></section>
 <section class="pf-card"><header><h2>How this forecast is calculated</h2><p>with this part's numbers</p></header>${pfBreakdown(p,c,sc)}</section>
 <section class="pf-card"><header><h2>Alert</h2></header><div class="pf-alert">${alert?`<span class="badge ${alert.kind==='predicted'?'Predicted':'Alert'}">${alert.kind==='predicted'?'Predicted':'Below minimum'}</span><p>${esc(alert.status)} since ${esc(new Date(alert.created_at).toLocaleString())}${alert.escalated_at?' · escalated from predicted':''}. Saved alerts use the saved settings, not this scenario.</p>${alert.status==='Open'?`<button type="button" data-pf-act="ack" data-id="${esc(alert.id)}">Acknowledge</button>`:''}`:`<p>No open alert for this part with the saved settings.</p>`}</div></section>`;
 return part==='hero'?hero:part==='main'?main:`<div id="pf-hero-wrap">${hero}</div><div class="pf-layout"><div class="pf-main" id="pf-main">${main}</div>${pfSide(p,c,sc)}</div>`}

// ---- interaction
function pfLive(src){
 const p=pfPart(),sc=PF.scen,base=pfBase(p),c=pfCalc(p,sc),k=src.dataset.pf;
 document.querySelectorAll(`[data-pf="${k}"]`).forEach(i=>{if(i!==src)i.value=pfVal(sc,k)});
 document.querySelectorAll('[data-ctl]').forEach(d=>d.classList.toggle('changed',JSON.stringify(pfVal(sc,d.dataset.ctl))!==JSON.stringify(pfVal(base,d.dataset.ctl))));
 const mh=$('#pf-hint-mult');if(mh)mh.innerHTML=pfMultHint(c,sc);
 $('#pf-savebox').innerHTML=pfSaveBox(p,sc);$('#pf-hero-wrap').innerHTML=pfBody(p,'hero');$('#pf-main').innerHTML=pfBody(p,'main');requestAnimationFrame(pfMeasure)}
function pfRefresh(){const p=pfPart();if(!p||!$('#pf-body'))return;PF.adv=$('#pf-adv')?.open;$('#pf-body').innerHTML=pfBody(p);requestAnimationFrame(pfMeasure)}
function pfMeasure(){const c=$('#pf-chart');if(!c)return;const w=Math.round(c.clientWidth);if(w&&Math.abs(w-(PF.widths.chart||0))>4){PF.widths.chart=w;const p=pfPart();if(p){const sc=PF.scen;c.innerHTML=pfChart(p,pfCalc(p,sc),sc)}}}
addEventListener('resize',()=>{clearTimeout(PF.rt);PF.rt=setTimeout(()=>view==='forecast'&&pfMeasure(),150)});
async function pfSave(){
 const p=pfPart(),sc=PF.scen,s=stockData.forecast.settings,base=pfBase(p);if(busy)return;busy=true;document.body.classList.add('busy');const done=[];
 try{
  const changes={};if(sc.leads.stocked!==s.lead_hours_stocked)changes.lead_hours_stocked=sc.leads.stocked;if(sc.leads.fab!==s.lead_hours_fab)changes.lead_hours_fab=sc.leads.fab;if(sc.safety!==s.safety_hours)changes.safety_hours=sc.safety;if(JSON.stringify(sc.weights)!==JSON.stringify(s.weights))changes.weights=sc.weights;if(sc.divergence!==s.divergence_pct)changes.divergence_pct=sc.divergence;
  if(Object.keys(changes).length){await api('/api/stock/settings',{dataset,...changes});done.push('settings')}
  if(sc.cls!==base.cls){await api('/api/stock/lead-class',{dataset,position:p.key,lead_class:sc.cls});done.push('lead class')}
  if(sc.available!==base.available){const r=await api('/api/stock/available',{dataset,position:p.key,available:sc.available});done.push('stock reading')}
  const keep={mode:sc.mode,mult:sc.mult,custom:sc.custom,min:sc.min,max:sc.max};PF.fresh=true;await loadStock();
  if(PF.scen){if(keep.min!==PF.scen.min||keep.max!==PF.scen.max||keep.mode!=='model'||keep.mult!==1){Object.assign(PF.scen,keep);render()}}
  const last=stockData.notifications[0];toast(`Saved ${done.join(', ')}.`+(last&&Date.now()-new Date(last.created_at)<5000?` ${last.subject}`:''))
 }catch(e){toast(e.message,true)}finally{busy=false;document.body.classList.remove('busy')}}
function bindForecast(){
 const s=$('#pf-search');if(!s)return;
 s.addEventListener('focus',()=>pfOpen(true));
 s.addEventListener('input',()=>{PF.q=s.value;PF.active=-1;pfOpen(true)});
 s.addEventListener('keydown',e=>{const n=(PF.list||[]).length;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!PF.open)pfOpen(true);PF.active=n?(PF.active+(e.key==='ArrowDown'?1:-1)+n)%n:-1;pfOpen(true);const o=$('#pf-opt-'+PF.active);if(o){o.scrollIntoView({block:'nearest'});s.setAttribute('aria-activedescendant',o.id)}}else if(e.key==='Enter'){e.preventDefault();const k=(PF.list||[])[PF.active<0?0:PF.active];if(k)pfChoose(k.key)}else if(e.key==='Escape')pfOpen(false)});
 $('#pf-results').addEventListener('pointerdown',e=>{const li=e.target.closest('li[data-key]');if(li){e.preventDefault();pfChoose(li.dataset.key)}});
 s.addEventListener('blur',()=>setTimeout(()=>pfOpen(false),120));
 const root=$('.pf');
 root.addEventListener('input',e=>{const k=e.target.dataset.pf;if(!k)return;const raw=e.target.value;if(raw==='')return;let v=Number(raw);if(!isFinite(v))return;const [,lo,hi]=PF_CTL[k];v=Math.max(lo,hi!=null?Math.min(hi,v):v);pfSetVal(PF.scen,k,v);pfLive(e.target)});
 root.addEventListener('click',e=>{const t=e.target;
  const cl=t.closest('[data-cls]');if(cl){PF.scen.cls=cl.dataset.cls;pfRefresh();return}
  const md=t.closest('[data-mode]');if(md){PF.scen.mode=md.dataset.mode;if(md.dataset.mode==='custom'&&PF.scen.custom==null){const c=pfCalc(pfPart(),{...PF.scen,mode:'model'});PF.scen.custom=c.rate!=null?Math.round(c.rate*10)/10:1}pfRefresh();return}
  const a=t.closest('[data-pf-act]');if(!a)return;
  if(a.dataset.pfAct==='reset'){PF.scen=null;pfSync();pfRefresh()}else if(a.dataset.pfAct==='save')pfSave();else if(a.dataset.pfAct==='ack')stockPost('/api/stock/ack',{id:a.dataset.id})});
 root.addEventListener('toggle',e=>{if(e.target.id==='pf-adv')PF.adv=e.target.open},true);
 root.addEventListener('pointermove',e=>{const hit=e.target.closest('#pf-hit'),tip=$('#pf-tip');if(!hit){if(!tip.hidden){tip.hidden=true;$('#pf-cross')?.setAttribute('visibility','hidden')}return}
  const ch=PF.chart,svg=hit.ownerSVGElement,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse()),t=Math.max(0,Math.min(ch.Hh,Math.round((q.x-ch.L)/(ch.W-ch.L-ch.R)*ch.Hh*2)/2));
  const cr=$('#pf-cross');cr.setAttribute('x1',ch.x(t));cr.setAttribute('x2',ch.x(t));cr.setAttribute('visibility','visible');
  tip.innerHTML=`<div class="t">In ${num(t,1)} h</div><div class="r"><span><i style="border-color:var(--series-1)"></i>Projected</span><b>${num(ch.stockAt(t),1)}</b></div>${ch.c.suggest?`<div class="r"><span><i style="border-color:var(--series-2);border-top-style:dashed"></i>Order now</span><b>${num(ch.order(t),1)}</b></div>`:''}<div class="r"><span>Minimum</span><b>${pfN(ch.sc.min,0)}</b></div>`;
  tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
 root.addEventListener('pointerleave',()=>{$('#pf-tip').hidden=true});
 requestAnimationFrame(pfMeasure)}
</script>

</body>
</html>
