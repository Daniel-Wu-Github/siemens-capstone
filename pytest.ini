[pytest]
pythonpath = src
testpaths = tests
addopts = -ra
markers =
    unit: Table A7.1 unit tests (UT-01..UT-12)
    integration: Table A7.2 integration tests (IT-01..IT-05)
    system: Table A7.3 system tests (ST-01..ST-07)
    validation: Table A7.4 validation tests (VT-01..VT-04)
    realdata: requires the Siemens workbooks in data/; skipped when absent
    browser: drives the dashboard with Playwright; requires chromium
