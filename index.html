<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Alerts</title>
<style>
:root{
/* space */--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
/* type */--font:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--t-xs:12px;--t-sm:13px;--t-md:14px;--t-lg:16px;--t-xl:20px;--t-2xl:28px;--lh-data:1.3;--lh-body:1.45;
/* colour: neutrals */--bg:#f4f5f6;--surface:#fff;--sunken:#eceef0;--ink:#16202a;--ink-2:#3b4752;--muted:#5b6773;--line:#d5d9de;--line-strong:#9aa4ae;
/* colour: accent (existing petrol) */--accent:#00757a;--accent-ink:#fff;--accent-wash:#e4f1f1;
/* colour: status, always paired with a text label */--alert:#b3261e;--alert-wash:#fbe9e7;--predicted:#9a5200;--predicted-wash:#fdf0dc;--watch:#2b5c8a;--watch-wash:#e6eef6;--ok:#2e6b3a;
/* shape */--radius:2px;--focus:0 0 0 2px #fff,0 0 0 4px var(--accent);--shadow-overlay:0 4px 16px rgba(22,32,42,.18);
/* motion */--dur:120ms;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-md)/var(--lh-body) var(--font)}
table,.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--focus)}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:var(--s5) var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.brand{font-weight:700;font-size:var(--t-lg);padding:0 var(--s2) var(--s4)}
.brand small{display:block;font-weight:400;font-size:var(--t-xs);color:var(--muted)}
aside a{display:block;padding:var(--s2);color:var(--ink-2);text-decoration:none;border-left:3px solid transparent;font-size:var(--t-md)}
aside a:hover{background:var(--sunken)}
aside a[aria-current]{border-left-color:var(--accent);background:var(--accent-wash);color:var(--ink);font-weight:600}
aside .grp{margin:var(--s5) var(--s2) var(--s1);font-size:var(--t-xs);color:var(--muted)}
aside a.legacy{font-size:var(--t-sm);color:var(--muted);padding:var(--s1) var(--s2)}
main{padding:var(--s5) var(--s6);min-width:0}
.legacy-banner{background:var(--predicted-wash);border:1px solid var(--predicted);padding:var(--s2) var(--s3);font-size:var(--t-sm);margin-bottom:var(--s4)}
header.page{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);border-bottom:1px solid var(--line-strong);padding-bottom:var(--s3);margin-bottom:var(--s4)}
h1{font-size:var(--t-2xl);line-height:1.15;margin:0;font-weight:700}
.asof{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)}
.btn{font:inherit;font-size:var(--t-sm);font-weight:600;padding:var(--s2) var(--s3);min-height:32px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius);cursor:pointer;transition:background var(--dur)}
.btn:hover{background:var(--sunken)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{background:#005c60}
.strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);margin-bottom:var(--s4)}
.strip div{padding:var(--s3) var(--s4);border-right:1px solid var(--line);min-width:150px;flex:1}
.strip div:last-child{border-right:0}
.strip b{display:block;font-size:var(--t-xl);font-weight:700;line-height:1.2}.strip span{font-size:var(--t-sm);color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
.cols>*{min-width:0}.panel{background:var(--surface);border:1px solid var(--line);margin-bottom:var(--s4)}
.panel>h2{margin:0;padding:var(--s3) var(--s4);font-size:var(--t-md);font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:var(--s3) var(--s4)}
.tools{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input,.tools select{font:inherit;font-size:var(--t-sm);padding:var(--s1) var(--s2);min-height:32px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface)}
.tools input{flex:1;min-width:140px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm);line-height:var(--lh-data)}
th{position:sticky;top:0;background:var(--sunken);text-align:left;font-weight:600;color:var(--ink-2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap;height:36px}
th.r,td.r{text-align:right}
tr.sel td{background:var(--accent-wash)}tbody tr:hover td{background:var(--sunken)}tr.sel:hover td{background:var(--accent-wash)}
.tag{display:inline-block;border:1px solid;padding:0 var(--s2);font-size:var(--t-xs);font-weight:600;line-height:20px;border-radius:var(--radius)}
.tag.alert{color:var(--alert);background:var(--alert-wash)}.tag.predicted{color:var(--predicted);background:var(--predicted-wash)}.tag.watch{color:var(--watch);background:var(--watch-wash)}.tag.ok{color:var(--ok);background:#fff}
.hb{display:inline-block;vertical-align:middle;width:110px;height:12px;position:relative;margin-right:var(--s2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s4);font-size:var(--t-sm);margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.step{font-size:var(--t-sm);padding:var(--s1) 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--s3)}.step:last-child{border:0}.step span:first-child{color:var(--muted)}
.note{font-size:var(--t-xs);color:var(--muted);margin-top:var(--s2)}
svg text{font:var(--t-xs) var(--font);fill:var(--muted)}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}

table.w2 td:nth-child(-n+2){white-space:normal;min-width:130px;max-width:230px}
.step small{display:block;color:var(--muted);font-size:var(--t-xs)}
.step>span:first-child{max-width:48%}.step>span:last-child{text-align:right}
td small{display:block;color:var(--muted);font-size:var(--t-xs)}
td.empty,.empty{white-space:normal}
.panel .empty{padding:var(--s5) var(--s4);color:var(--muted)}.panel .empty b{display:block;color:var(--ink);font-size:var(--t-lg);margin-bottom:var(--s1)}.panel .empty p{margin:var(--s2) 0 0}
a.btn{display:inline-block;text-decoration:none;line-height:16px}
.btn.small{min-height:24px;padding:var(--s1) var(--s2);font-size:var(--t-xs)}.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.cell{font:inherit;font-size:var(--t-sm);width:84px;padding:var(--s1) var(--s2);border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);text-align:right}select.cell{width:auto;text-align:left}.cell.edited{border-color:var(--predicted);color:var(--predicted);font-weight:600}
td.act{text-align:right}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--muted)}
.mail{white-space:pre-wrap;background:var(--sunken);border:1px solid var(--line);padding:var(--s3);font:var(--t-xs)/1.4 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto;margin:var(--s2) 0 0}
.form-row{display:grid;gap:var(--s1);margin-bottom:var(--s3)}.form-row label{font-size:var(--t-sm);color:var(--ink-2)}.form-row input{font:inherit;font-size:var(--t-sm);padding:var(--s1) var(--s2);min-height:32px;border:1px solid var(--line-strong);border-radius:var(--radius);max-width:280px}
.err{color:var(--alert);font-size:var(--t-sm)}.plain{margin:0;padding-left:var(--s5)}.plain li{margin-bottom:var(--s2)}
.panel>h2 .btn{margin-left:var(--s3)}.panel>h2{gap:var(--s3)}
tr[data-pred]{cursor:pointer}
#toast{position:fixed;bottom:var(--s5);right:var(--s5);background:var(--ink);color:#fff;padding:var(--s3) var(--s4);border-radius:var(--radius);box-shadow:var(--shadow-overlay);max-width:420px;font-size:var(--t-sm);z-index:10}#toast.error{background:var(--alert)}#toast[hidden]{display:none}
.busy{cursor:progress}
.tag.none{color:var(--muted);background:var(--sunken);border-color:var(--line-strong)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell"><aside id="nav" aria-label="Main navigation"></aside><main id="main"><div class="empty">Loading…</div></main></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = (n, d = 0) => n == null ? '—' : Number(n).toLocaleString('en-US', {maximumFractionDigits: d});
const fmtHours = h => h == null ? '—' : `${fmt(h, h >= 100 ? 0 : 1)} h`;
const fmtWhen = s => s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
const PAGES = [['stock', 'Stock alerts'], ['predicted', 'Predicted alerts'], ['insights', 'Replenishment insights']];
const SETUP = [['data', 'Data sources'], ['settings', 'Settings']];
const TITLES = Object.fromEntries([...PAGES, ...SETUP]);
const PER = 50;

let view = 'stock', datasets = [], ds = null, stock = null, stockFor = null, sources = null, sourcesFor = null;
let busy = false, toastTimer, stockFilter = 'all', stockSearch = '', stockPage = 0;
let predFilter = 'act', predSearch = '', predPage = 0, selected = null;

function toast(message, error = false) {
  const t = $('#toast'); t.textContent = message; t.className = error ? 'error' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, error ? 9000 : 4500);
}
async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let data;
  try { data = await response.json(); } catch { throw Error('The server returned an unreadable response.'); }
  if (!response.ok) throw Error(data.error || 'Request failed.');
  return data;
}
async function guarded(work) {
  if (busy) return;
  busy = true; document.body.classList.add('busy');
  try { return await work(); } catch (e) { toast(e.message, true); } finally { busy = false; document.body.classList.remove('busy'); }
}
function armed(b, prompt) {
  if (b.dataset.armed) { clearTimeout(+b.dataset.armed); delete b.dataset.armed; b.textContent = b.dataset.label; return true; }
  b.dataset.label = b.textContent; b.textContent = prompt;
  b.dataset.armed = setTimeout(() => { delete b.dataset.armed; b.textContent = b.dataset.label; }, 4000);
  return false;
}

/* ---------- data loading ---------- */
async function loadDatasets() {
  datasets = await api('/api/datasets');
  ds = datasets.length ? datasets[datasets.length - 1].id : null;
}
async function loadStock() {
  const requested = ds;
  try { const d = await api('/api/stock?dataset=' + encodeURIComponent(requested)); if (requested !== ds) return; stock = d; }
  catch (e) { stock = {error: e.message}; }
  stockFor = requested;
  if (view === 'stock' || view === 'predicted' || view === 'settings') render();
}
async function loadSources() {
  const requested = ds;
  try { const d = await api('/api/sources?dataset=' + encodeURIComponent(requested)); if (requested !== ds) return; sources = d; }
  catch (e) { sources = {error: e.message}; }
  sourcesFor = requested;
  if (view === 'data') render();
}
function invalidate() { stock = null; stockFor = null; sources = null; sourcesFor = null; }

/* ---------- shared pieces ---------- */
function nav() {
  const link = ([k, t]) => `<a href="#${k}"${k === view ? ' aria-current="page"' : ''}>${t}</a>`;
  $('#nav').innerHTML = `<div class="brand">Stock Alerts<small>Supermarket bins</small></div>${PAGES.map(link).join('')}<div class="grp">Setup</div>${SETUP.map(link).join('')}`;
}
function head(title, asof, actions = '') {
  return `<header class="page"><div><h1>${esc(title)}</h1><div class="asof">${asof}</div></div><div class="actions">${actions}</div></header>`;
}
function strip(items) {
  return `<div class="strip">${items.map(([v, l, id]) => `<div><b class="num"${id ? ` id="${id}"` : ''}>${v}</b><span>${esc(l)}</span></div>`).join('')}</div>`;
}
function note(title, text, link) {
  return `<section class="panel"><div class="body empty"><b>${esc(title)}</b>${text ? `<p>${text}</p>` : ''}${link ? `<p><a class="btn primary" href="#data">${esc(link)}</a></p>` : ''}</div></section>`;
}
const tag = (cls, text) => `<span class="tag ${cls}">${esc(text)}</span>`;
function tierOf(p) {
  if (p.forecast === 'below_min' || p.status === 'Alert') return ['alert', 'Alert'];
  if (p.status === 'Predicted') return ['predicted', 'Predicted'];
  if (p.status === 'Watch' || p.forecast === 'watch') return ['watch', 'Watch'];
  if (p.forecast === 'ok') return ['ok', 'OK'];
  if (p.forecast === 'no_rate') return ['none', 'No rate'];
  return ['none', p.status];
}
function hoursBar(h, tick) {
  const w = 140, scale = 72, x = Math.min(h, scale) / scale * w;
  const color = h <= tick ? 'var(--predicted)' : h <= scale ? 'var(--watch)' : 'var(--line-strong)';
  return `<svg class="hb" viewBox="0 0 ${w} 12" aria-hidden="true"><rect x="0" y="4" width="${w}" height="4" fill="var(--sunken)"/><rect x="0" y="4" width="${x}" height="4" fill="${color}"/><line x1="${Math.min(tick, scale) / scale * w}" x2="${Math.min(tick, scale) / scale * w}" y1="0" y2="12" stroke="var(--ink)"/></svg>`;
}
function needData() { return !ds; }
function noDataPage(title) {
  return head(title, 'No workbook imported yet') + note('Import a workbook first', 'Stock alerts need the manufacturing workbook, a Min/Max tolerance file and a bin-status snapshot.', 'Go to Data sources');
}
function loadingPage(title) { return head(title, 'Loading') + note('Loading…'); }

/* ---------- Stock alerts (Phase 1) ---------- */
function stockRows() {
  if (!$('#stock-rows')) return;
  const d = stock, openBy = Object.fromEntries(d.open_alerts.map(a => [a.position, a])), q = stockSearch.toLowerCase();
  const order = {Alert: 0, Predicted: 1, 'No tolerance': 2, 'No stock': 3, OK: 4};
  const rows = d.positions.filter(p => (stockFilter === 'all' || (stockFilter === 'edited' ? p.overridden : stockFilter === 'OK' ? (p.status === 'OK' || p.status === 'Predicted') : p.status === stockFilter)) &&
      [p.material, p.description, p.supermarket, p.bin].join(' ').toLowerCase().includes(q))
    .sort((a, b) => order[a.status] - order[b.status] || a.supermarket.localeCompare(b.supermarket) || a.bin.localeCompare(b.bin));
  const pages = Math.max(1, Math.ceil(rows.length / PER)); stockPage = Math.min(stockPage, pages - 1);
  $('#stock-rows').innerHTML = rows.slice(stockPage * PER, stockPage * PER + PER).map(p => {
    const a = openBy[p.key], [tc, tt] = p.status === 'Alert' ? ['alert', 'Alert'] : p.status === 'OK' ? ['ok', 'OK'] : p.status === 'Predicted' ? ['ok', 'OK'] : ['none', p.status];
    return `<tr><td>${esc(p.description || p.material)}<small>${esc(p.material)}</small></td><td>${esc(p.supermarket)}<small>${esc(p.storage_type)} / ${esc(p.bin)}</small></td>
<td class="r"><input class="cell${p.overridden ? ' edited' : ''}" type="number" min="0" step="1" value="${p.available ?? ''}" data-stock-pos="${esc(p.key)}" aria-label="Available stock for ${esc(p.material)} ${esc(p.bin)}">${p.overridden ? `<small>source ${fmt(p.source_available)}</small>` : ''}</td>
<td class="r">${fmt(p.min)}</td><td class="r">${fmt(p.max)}${p.note ? `<small>${esc(p.note)}</small>` : ''}</td><td>${tag(tc, tt)}${a ? `<small>${esc(a.status)} since ${esc(fmtWhen(a.created_at))}</small>` : ''}</td>
<td class="act"><button class="btn small" data-stock-set="${esc(p.key)}">Set</button>${p.overridden ? ` <button class="btn small" data-stock-clear="${esc(p.key)}">Reset</button>` : ''}${a && a.status === 'Open' ? ` <button class="btn small" data-stock-ack="${esc(a.id)}">Acknowledge</button>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">No positions match.</td></tr>';
  $('#stock-count').textContent = `${fmt(rows.length)} matching positions · page ${stockPage + 1} of ${pages}`;
  $('#stock-prev').disabled = stockPage === 0; $('#stock-next').disabled = stockPage >= pages - 1;
}
function stockPageHtml() {
  const title = TITLES.stock;
  if (needData()) return noDataPage(title);
  if (stockFor !== ds || !stock) { loadStock(); return loadingPage(title); }
  if (stock.error) return head(title, 'Unavailable') + note('Stock alerts unavailable', esc(stock.error));
  const d = stock, sm = d.summary, ch = d.channels, last = d.notifications[0];
  const empty = d.positions.filter(p => p.status === 'Alert' && p.min === 0).length;
  const chan = ch.email.configured ? `Email to ${esc(ch.email.recipients.join(', '))}` : 'Email not configured (saved to outbox)';
  return head(title, `Phase 1 · snapshot ${d.snapshot_as_of ? esc(d.snapshot_as_of) : 'date not supplied'} · ${esc(ch.rule_text)}`,
      '<button class="btn" data-stock="check">Run check</button><button class="btn" data-stock="digest">Send digest</button><button class="btn" data-stock="reset">Reset simulated stock</button>') +
    (d.tolerances_loaded ? '' : '<div class="legacy-banner">Min/Max tolerances not imported. Add the Min/Max file under Data sources to evaluate alerts.</div>') +
    strip([[fmt(sm.alerts), 'Open alerts', 'stock-alert-count'], [fmt(empty), 'Empty bins, minimum 0'], [fmt(sm.positions), 'Positions checked'], [fmt(sm.overridden), 'Simulated edits']]) +
    `<div class="cols"><section class="panel"><div class="tools"><input id="stock-search" placeholder="Search material, description, supermarket or bin" value="${esc(stockSearch)}" aria-label="Search stock positions"><select id="stock-filter" aria-label="Stock alert filter"><option value="all">All positions</option><option value="Alert">Alerts</option><option value="OK">OK</option><option value="edited">Simulated edits</option></select></div>
<div class="tw"><table class="w2"><thead><tr><th>Material<th>Location<th class="r">Available<th class="r">Min<th class="r">Max<th>Status<th></th></tr></thead><tbody id="stock-rows"></tbody></table></div>
<div class="foot"><span id="stock-count"></span><span><button class="btn small" id="stock-prev">Previous</button> <button class="btn small" id="stock-next">Next</button></span></div></section>
<div><section class="panel"><h2>Delivery</h2><div class="body"><dl class="kv"><dt>Email<dd>${chan}<dt>Teams<dd>${ch.teams.configured ? 'Connected' : 'Not configured'}<dt>Webhook<dd>${ch.webhook.configured ? 'Connected' : 'Not configured'}</dl><div class="note">Every change is sent once, with only the changes. Edit Available to simulate a reading; source files never change.</div></div></section>
${last ? `<section class="panel"><h2>Last notification</h2><div class="body"><b>${esc(last.subject)}</b><div class="note">${esc(fmtWhen(last.created_at))} · ${last.results.map(r => esc(r.channel + ': ' + r.status)).join(' · ')}</div><pre class="mail" id="mail-preview">${esc(last.text)}</pre></div></section>` : ''}</div></div>`;
}
async function stockPost(path, body) {
  await guarded(async () => {
    const r = await api(path, {dataset: ds, ...body}); await loadStock();
    const n = r && r.notification;
    if (n) toast(`${n.subject}: ` + n.results.map(x => x.channel + ' ' + x.status).join(', '));
    else if (r && r.resolved) toast(`${r.resolved} alert(s) resolved.`);
    else toast('Saved. No alert change.');
  });
}
function setStock(pos) {
  const input = [...document.querySelectorAll('[data-stock-pos]')].find(i => i.dataset.stockPos === pos);
  if (!input) return;
  const v = input.value.trim();
  if (v === '' || !(Number(v) >= 0)) { toast('Enter a whole number of zero or more.', true); return; }
  stockPost('/api/stock/available', {position: pos, available: Number(v)});
}
function bindStock() {
  if (!$('#stock-rows')) return;
  $('#stock-filter').value = stockFilter; stockRows();
  $('#stock-search').addEventListener('input', e => { stockSearch = e.target.value; stockPage = 0; stockRows(); });
  $('#stock-filter').addEventListener('change', e => { stockFilter = e.target.value; stockPage = 0; stockRows(); });
  $('#stock-prev').addEventListener('click', () => { stockPage--; stockRows(); });
  $('#stock-next').addEventListener('click', () => { stockPage++; stockRows(); });
  $('#stock-rows').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.stockPos) { e.preventDefault(); setStock(e.target.dataset.stockPos); } });
  $('#stock-rows').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.stockSet) setStock(b.dataset.stockSet);
    else if (b.dataset.stockClear) stockPost('/api/stock/available', {position: b.dataset.stockClear, available: null});
    else if (b.dataset.stockAck) stockPost('/api/stock/ack', {id: b.dataset.stockAck});
  });
}

/* ---------- Predicted alerts (Phase 2) ---------- */
function predRows() {
  const d = stock, q = predSearch.toLowerCase();
  const inView = p => predFilter === 'act' ? (p.forecast === 'below_min' || p.status === 'Predicted' || p.forecast === 'watch')
    : predFilter === 'rate' ? ['below_min', 'ok', 'within_lead', 'watch'].includes(p.forecast)
    : predFilter === 'norate' ? p.forecast === 'no_rate' : true;
  return d.positions.filter(p => inView(p) && [p.material, p.description, p.supermarket, p.bin].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.hours_to_min ?? 1e9) - (b.hours_to_min ?? 1e9) || a.material.localeCompare(b.material));
}
function projection(p, tick, scale) {
  const W = 345, H = 150, x0 = 40, x1 = 310, y0 = 10, y1 = 120, rate = (p.demand_per_day || 0) / 24;
  const top = Math.max(p.available, p.min, 1) * 1.1, y = v => y1 - Math.max(0, Math.min(v, top)) / top * (y1 - y0), x = h => x0 + h / scale * (x1 - x0);
  const endV = p.available - rate * scale, hit = p.hours_to_min != null && p.hours_to_min <= scale && rate > 0;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${hit ? `Projected stock reaches the minimum in ${fmtHours(p.hours_to_min)}` : 'Projected stock over the next 72 hours'}">
<rect x="${x0}" y="${y0}" width="${x(Math.min(tick, scale)) - x0}" height="${y1 - y0}" fill="var(--predicted-wash)"/>
<line x1="${x0}" x2="${x1}" y1="${y(p.min)}" y2="${y(p.min)}" stroke="var(--alert)" stroke-dasharray="4 3"/><text x="${x1 + 2}" y="${y(p.min) + 4}">min</text>
<line x1="${x0}" y1="${y(p.available)}" x2="${x1}" y2="${y(endV)}" stroke="var(--ink)" stroke-width="2"/>
${hit ? `<circle cx="${x(p.hours_to_min)}" cy="${y(p.min)}" r="4" fill="var(--ink)"/>` : ''}
<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" stroke="var(--line-strong)"/><line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="var(--line-strong)"/>
<text x="${x0 - 6}" y="${y(p.available) + 4}" text-anchor="end">${fmt(p.available)}</text><text x="${x0 - 6}" y="${y1 + 4}" text-anchor="end">0</text>
<text x="${x0}" y="137">now</text>${tick / scale > 0.15 ? `<text x="${x(Math.min(tick, scale))}" y="137" text-anchor="middle">${fmt(tick, 0)} h</text>` : ""}<text x="${x1}" y="137" text-anchor="end">${scale} h</text></svg>`;
}
function detailHtml(p, fs) {
  if (!p) return '<section class="panel"><div class="body empty">Select a row to see how it was calculated.</div></section>';
  const inp = p.demand_inputs || {}, tick = p.lead_hours + fs.safety_hours;
  const used = p.demand_basis || [], dropped = p.demand_dropped || [];
  const steps = [];
  steps.push(['History per day', inp.history == null ? 'none' : fmt(inp.history, 2)]);
  steps.push(['Schedule per day', inp.schedule == null ? 'none' : fmt(inp.schedule, 2)]);
  if (dropped.length) steps.push(['Rule', `differs by more than ${fmt(fs.divergence_pct)}%, ${dropped.join(', ')} dropped`]);
  steps.push(['Demand per day', `${p.demand_per_day == null ? 'none' : fmt(p.demand_per_day, 2)}${used.length ? ' (' + used.join(' + ') + ')' : ''}`]);
  if (p.hours_to_min != null && p.demand_per_day) steps.push(['Hours to minimum', `(${fmt(p.available)} − ${fmt(p.min)}) / ${fmt(p.demand_per_day, 2)} × 24 = ${fmtHours(p.hours_to_min)}`]);
  steps.push(['Alert threshold', `lead ${fmt(p.lead_hours, 1)} h + safety ${fmt(fs.safety_hours, 1)} h = ${fmt(tick, 1)} h`]);
  steps.push(['Suggested quantity', p.suggested_qty == null ? '—' : fmt(p.suggested_qty)]);
  const [tc, tt] = tierOf(p);
  return `<section class="panel"><h2>${esc(p.description || p.material)} ${tag(tc, tt)}</h2><div class="body">${p.hours_to_min != null && p.demand_per_day ? projection(p, tick, 72) : '<div class="note">No projection: this position has no demand rate or is already at its minimum.</div>'}
<div class="note">${esc(p.material)} · ${esc(p.supermarket)} · ${esc(p.storage_type)} / ${esc(p.bin)}. Shaded: lead + safety window.</div></div></section>
<section class="panel"><h2>How it was calculated</h2><div class="body">${steps.map(([a, b]) => `<div class="step"><span>${esc(a)}</span><span class="num">${esc(b)}</span></div>`).join('')}
<div class="step"><span>Lead class</span><span><select class="cell" data-lead-pos="${esc(p.key)}" aria-label="Lead class for ${esc(p.material)} ${esc(p.bin)}"><option value="stocked"${p.lead_class === 'stocked' ? ' selected' : ''}>stocked</option><option value="fab"${p.lead_class === 'fab' ? ' selected' : ''}>fab</option></select></span></div></div></section>`;
}
function predPageHtml() {
  const title = TITLES.predicted;
  if (needData()) return noDataPage(title);
  if (stockFor !== ds || !stock) { loadStock(); return loadingPage(title); }
  if (stock.error) return head(title, 'Unavailable') + note('Predicted alerts unavailable', esc(stock.error));
  const d = stock, fs = d.forecast.settings, cs = d.forecast.summary;
  const rows = predRows(), pages = Math.max(1, Math.ceil(rows.length / PER)); predPage = Math.min(predPage, pages - 1);
  const shown = rows.slice(predPage * PER, predPage * PER + PER);
  const sel = d.positions.find(p => p.key === selected) || shown[0] || null; selected = sel ? sel.key : null;
  const withRate = cs.below_min + cs.predicted + cs.ok;
  return head(title, `Phase 2 · stock as of ${d.snapshot_as_of ? esc(d.snapshot_as_of) : 'undated snapshot'} · warns when hours to minimum ≤ lead time + ${fmt(fs.safety_hours)} h`) +
    strip([[fmt(cs.predicted), 'Predicted, emailed', 'stock-predicted-count'], [fmt(cs.below_min), 'Already below minimum'], [fmt(withRate), 'Positions with a demand rate'], [fmt(cs.no_rate), 'No rate, not forecast']]) +
    `<div class="cols"><section class="panel"><div class="tools"><input id="pred-search" placeholder="Search material, description, supermarket or bin" value="${esc(predSearch)}" aria-label="Search predicted alerts"><select id="pred-filter" aria-label="Predicted alert filter"><option value="act">Predicted and below minimum</option><option value="rate">All with a demand rate</option><option value="norate">No demand rate</option><option value="all">All positions</option></select></div>
<div class="tw"><table class="w2"><thead><tr><th>Material<th>Location<th class="r">Available<th class="r">Min<th class="r">Demand / day<th>Hours to minimum<th>Tier</tr></thead><tbody id="pred-rows">${shown.map(p => {
      const [tc, tt] = tierOf(p), tick = p.lead_hours + fs.safety_hours;
      return `<tr data-pred="${esc(p.key)}" class="${p.key === selected ? 'sel' : ''}" tabindex="0"><td>${esc(p.description || p.material)}<small>${esc(p.material)}</small></td><td>${esc(p.supermarket)}<small>${esc(p.storage_type)} / ${esc(p.bin)}</small></td><td class="r">${fmt(p.available)}</td><td class="r">${fmt(p.min)}</td><td class="r">${p.demand_per_day == null ? '—' : fmt(p.demand_per_day, 2)}</td><td>${p.hours_to_min == null ? '—' : hoursBar(p.hours_to_min, tick) + `<span class="num">${fmtHours(p.hours_to_min)}</span>`}</td><td>${tag(tc, tt)}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">No positions match.</td></tr>'}</tbody></table></div>
<div class="foot"><span>${fmt(rows.length)} matching positions · page ${predPage + 1} of ${pages}. Bar: 0 to 72 h, black tick: lead + safety.</span><span><button class="btn small" id="pred-prev"${predPage === 0 ? ' disabled' : ''}>Previous</button> <button class="btn small" id="pred-next"${predPage >= pages - 1 ? ' disabled' : ''}>Next</button></span></div></section>
<div id="pred-detail">${detailHtml(sel, fs)}<section class="panel"><h2>Settings <a class="btn small" href="#settings">Edit</a></h2><div class="body"><dl class="kv"><dt>Lead time<dd>${fmt(fs.lead_hours_stocked, 1)} h stocked · ${fmt(fs.lead_hours_fab, 1)} h fab<dt>Safety buffer<dd>${fmt(fs.safety_hours, 1)} h<dt>Weights<dd>history ${fmt(fs.weights.history, 1)} · schedule ${fmt(fs.weights.schedule, 1)} · observed ${fmt(fs.weights.observed, 1)}<dt>Divergence<dd>${fmt(fs.divergence_pct)}%</dl></div></section></div></div>`;
}
function bindPred() {
  if (!$('#pred-rows')) return;
  $('#pred-filter').value = predFilter;
  $('#pred-search').addEventListener('input', e => { predSearch = e.target.value; predPage = 0; render(); const s = $('#pred-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); });
  $('#pred-filter').addEventListener('change', e => { predFilter = e.target.value; predPage = 0; render(); });
  $('#pred-prev')?.addEventListener('click', () => { predPage--; render(); });
  $('#pred-next')?.addEventListener('click', () => { predPage++; render(); });
  const pick = tr => { if (tr) { selected = tr.dataset.pred; render(); } };
  $('#pred-rows').addEventListener('click', e => pick(e.target.closest('tr[data-pred]')));
  $('#pred-rows').addEventListener('keydown', e => { if (e.key === 'Enter') pick(e.target.closest('tr[data-pred]')); });
  $('#pred-detail').addEventListener('change', e => { if (e.target.dataset.leadPos) stockPost('/api/stock/lead-class', {position: e.target.dataset.leadPos, lead_class: e.target.value}); });
}

/* ---------- Replenishment insights (View 2): backend not built yet ---------- */
function insightsPageHtml() {
  return head(TITLES.insights, 'Planned view · backend to be specified') +
    '<div class="legacy-banner">Not built yet. This page will list problem parts and show how far each refill reached against its maximum. No numbers are shown until the backend exists.</div>' +

/* ---------- Data sources ---------- */
function refCard(refs) {
  const R = Object.assign({}, refs || {});
  for (const k of ['tolerances', 'bom']) if (R[k] && R[k].loaded === false) R[k] = null;
  const t = R.tolerances, b = R.bom, sn = Array.isArray(R.snapshots) ? R.snapshots : [];
  const row = (name, ok, detail) => `<div class="step"><span>${name}</span><span>${ok ? 'Imported' : 'Not imported'}: ${detail}</span></div>`;
  return `<section class="panel"><h2>Reference files</h2><div class="body"><div class="form-row"><label for="ref-input">Reference file (XLSX or CSV, up to 32 MB)</label><input id="ref-input" type="file" accept=".xlsx,.csv"></div>
<div class="form-row"><label for="ref-asof">Snapshot date (stock snapshots only)</label><input id="ref-asof" type="date"></div>
<p id="ref-status" class="note" aria-live="polite">The file type is detected from its headers. Importing refreshes the analysis; source rows are unchanged.</p>
${row('Min/Max tolerances', t, t ? `${fmt(t.rows)} rows, ${fmt(t.matched_positions)} matched positions, ${fmt(t.zero_min)} with zero minimum, ${fmt(t.invalid)} with min > max` : 'add the Min/Max file')}
${row('Bill of materials', b, b ? `${fmt(b.rows)} rows, ${fmt(b.parts)} parts` : 'add the BOM file')}
${row('Stock snapshots', sn.length, sn.length ? sn.map(s => `${esc(s.as_of || 'undated')} (${fmt(s.rows)} rows)`).join(', ') : 'add a dated bin-status file')}</div></section>`;
}
function dataPageHtml() {
  const title = TITLES.data;
  const importer = `<section class="panel"><h2>Import a manufacturing workbook</h2><div class="body"><div class="form-row"><label for="file-input">Workbook (XLSX, up to 32 MB)</label><input id="file-input" type="file" accept=".xlsx"></div><p id="import-status" class="note" aria-live="polite">Import keeps the original rows and reports potential joins. It does not invent missing history.</p></div></section>`;
  if (needData()) return head(title, 'No workbook imported yet') + `<div class="cols"><div>${importer}</div><div></div></div>`;
  if (sourcesFor !== ds || !sources) { loadSources(); return head(title, 'Loading') + importer; }
  if (sources.error) return head(title, 'Unavailable') + importer + note('Sources unavailable', esc(sources.error));
  const q = sources.quality, d = sources.dataset;
  return head(title, `${esc(d.name)} · ${fmt(q.total_rows)} rows saved locally`) +
    strip([[fmt(q.total_rows), 'Persisted data rows'], [fmt(q.sheets.length), 'Source sheets'], [fmt(q.findings.length), 'Quality findings'], [fmt(sources.references.snapshots.length), 'Stock snapshots']]) +
    `<div class="cols"><div>
<section class="panel"><h2>Source inventory</h2><div class="tw"><table><thead><tr><th>Source<th class="r">Rows<th class="r">Columns<th>Candidate grain</tr></thead><tbody>${q.sheets.map(s => `<tr><td>${esc(s.name)}<td class="r">${fmt(s.rows)}<td class="r">${s.columns}<td>${esc(s.grain)}</tr>`).join('')}</tbody></table></div></section>
<section class="panel"><h2>Quality findings</h2><div class="body">${q.findings.length ? q.findings.map(f => `<div class="step"><span>${esc(f.code.replaceAll('_', ' '))}<small>${esc(f.sheet)} · ${esc(f.severity)}</small></span><span>${fmt(f.count)}: ${esc(f.message)}</span></div>`).join('') : '<div class="note">No structural findings.</div>'}</div></section>
<section class="panel"><h2>Join coverage</h2><div class="body">${q.joins.length ? q.joins.map(j => `<div class="step"><span>${esc(j.name)}<small>${esc(j.description)}</small></span><span class="num">${fmt(j.matched)} / ${fmt(j.total)}</span></div>`).join('') : '<div class="note">None measured.</div>'}</div></section>
<section class="panel"><h2>Recent activity</h2><div class="body">${sources.activity.map(a => `<div class="step"><span>${esc(fmtWhen(a.created_at))}</span><span>${esc(a.message)}</span></div>`).join('') || '<div class="note">None.</div>'}</div></section></div>
<div>${importer}${refCard(sources.references)}</div></div>`;
}
async function importFile(file, reference) {
  if (!file || busy) return;
  const ok = reference ? /\.(xlsx|csv)$/i.test(file.name) : file.name.toLowerCase().endsWith('.xlsx');
  if (!ok || file.size > 32 * 1024 * 1024) { toast(reference ? 'Choose an XLSX or CSV file under 32 MB.' : 'Choose an XLSX file under 32 MB.', true); return; }
  const status = $(reference ? '#ref-status' : '#import-status'), asOf = reference ? $('#ref-asof').value : '';
  await guarded(async () => {
    status.textContent = 'Importing and checking rows… Large files can take a minute.';
    const url = '/api/import?filename=' + encodeURIComponent(file.name) + (reference ? '&dataset=' + encodeURIComponent(ds) + (asOf ? '&as_of=' + encodeURIComponent(asOf) : '') : '');
    const res = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/octet-stream'}, body: file});
    let r; try { r = await res.json(); } catch { throw Error('The server returned an unreadable response.'); }
    if (!res.ok) { status.textContent = r.error || 'Import failed.'; throw Error(r.error || 'Import failed.'); }
    invalidate(); await loadDatasets();
    if (!reference) ds = r.id;
    toast(reference ? `Reference file imported (${r.kind}).` : 'Workbook imported.'); render();
  });
}
function bindData() {
  $('#file-input')?.addEventListener('change', e => importFile(e.target.files[0], false));
  $('#ref-input')?.addEventListener('change', e => importFile(e.target.files[0], true));
}

/* ---------- Settings ---------- */
function settingsPageHtml() {
  const title = TITLES.settings;
  if (needData()) return noDataPage(title);
  if (stockFor !== ds || !stock) { loadStock(); return loadingPage(title); }
  if (stock.error) return head(title, 'Unavailable') + note('Settings unavailable', esc(stock.error));
  const fs = stock.forecast.settings;
  const FIELDS = [['lead_hours_stocked', 'Stocked lead time (h)', fs.lead_hours_stocked], ['lead_hours_fab', 'Fab lead time (h)', fs.lead_hours_fab], ['safety_hours', 'Safety buffer (h)', fs.safety_hours],
    ['history', 'History weight', fs.weights.history], ['schedule', 'Schedule weight', fs.weights.schedule], ['observed', 'Observed weight', fs.weights.observed], ['divergence_pct', 'Divergence threshold (%)', fs.divergence_pct]];
  return head(title, 'Forecast settings apply to every position') +
    `<div class="cols"><section class="panel"><h2>Forecast settings</h2><div class="body"><form id="forecast-form">${FIELDS.map(([k, l, v]) => `<div class="form-row"><label for="fc-${k}">${esc(l)}</label><input id="fc-${k}" data-fc="${k}" type="number" min="0" step="any" value="${esc(v)}"></div>`).join('')}
<p><button class="btn primary" type="submit">Save forecast settings</button> <span id="forecast-error" class="err" role="alert"></span></p></form>
<div class="note">A schedule that differs from history by more than the divergence threshold replaces history.</div></div></section><div></div></div>`;
}
function bindSettings() {
  $('#forecast-form')?.addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#forecast-error'); err.textContent = '';
    const body = {weights: {}};
    document.querySelectorAll('[data-fc]').forEach(i => { const k = i.dataset.fc; if (['history', 'schedule', 'observed'].includes(k)) body.weights[k] = i.value; else body[k] = i.value; });
    if (busy) return; busy = true; document.body.classList.add('busy');
    try { const r = await api('/api/stock/settings', {dataset: ds, ...body}); await loadStock(); toast(r && r.notification ? r.notification.subject : 'Forecast settings saved.'); }
    catch (x) { err.textContent = x.message; } finally { busy = false; document.body.classList.remove('busy'); }
  });
}

/* ---------- shell ---------- */
function render() {
  nav();
  const html = {stock: stockPageHtml, predicted: predPageHtml, insights: insightsPageHtml, data: dataPageHtml, settings: settingsPageHtml}[view]();
  $('#main').innerHTML = html;
  bindStock(); bindPred(); bindData(); bindSettings();
  document.title = `${TITLES[view]} · Stock Alerts`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-stock]'); if (!b) return;
  const kind = b.dataset.stock;
  if (kind === 'check') stockPost('/api/stock/check', {});
  else if (kind === 'digest' && armed(b, 'Click again to send')) stockPost('/api/stock/digest', {});
  else if (kind === 'reset' && armed(b, 'Click again to reset')) stockPost('/api/stock/reset', {});
});
function route() { const h = location.hash.slice(1); view = TITLES[h] ? h : 'stock'; render(); }
window.addEventListener('hashchange', route);
(async () => { try { await loadDatasets(); } catch (e) { toast(e.message, true); } route(); })();
</script>
</body>
