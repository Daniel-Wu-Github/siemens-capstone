<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Design mock</title>
<link rel=stylesheet href=tokens.css><link rel=stylesheet href=app.css>
<body><div class=shell><aside id=nav></aside><main id=main></main></div>
<script>
const p=new URLSearchParams(location.search).get('p')||'predicted';
const items=[['stock','Stock alerts'],['predicted','Predicted alerts'],['insights','Replenishment insights']];
document.getElementById('nav').innerHTML=`<div class=brand>Stock Alerts<small>Supermarket bins</small></div>`+
items.map(([k,t])=>`<a href=#${k}${k===p?' aria-current=page':''}>${t}</a>`).join('')+
`<div class=grp>Setup</div><a href=#>Data sources</a><a href=#>Settings</a><div class=grp>Legacy, demo only</div><a class=legacy href=#>Overview</a><a class=legacy href=#>Materials &amp; alerts</a><a class=legacy href=#>Model evaluation</a><a class=legacy href=#>Workbook insights</a>`;
const fmt=n=>n.toLocaleString('en-US');
/* hours bar: scale 0-72h, tick at lead+safety (27h) and watch (72h = end) */
function hb(h){const w=140,x=Math.min(h,72)/72*w,c=h<=27?'var(--predicted)':h<=72?'var(--watch)':'var(--line-strong)';
return `<svg class=hb viewBox="0 0 140 12" aria-hidden=true><rect x=0 y=4 width=140 height=4 fill="var(--sunken)"/><rect x=0 y=4 width=${x} height=4 fill="${c}"/><line x1=${27/72*w} x2=${27/72*w} y1=0 y2=12 stroke="var(--ink)" stroke-width=1 /></svg>`}
const tag=(c,t)=>`<span class="tag ${c}">${t}</span>`;
let h='';
if(p==='stock'){
const R=[['P-1042','A-03-11',0,0,40,'alert','Oct 29 06:10'],['P-2210','A-07-02',4,5,60,'alert','Oct 29 06:10'],['P-0877','B-01-14',18,20,90,'alert','Oct 28 06:10'],['P-3301','C-12-05',0,0,25,'alert','Oct 27 06:10'],['P-1190','B-09-08',30,30,120,'alert','Oct 26 06:10']];
h=`<header class=page><div><h1>Stock alerts</h1><div class=asof>Phase 1 · latest snapshot Oct 29, 06:10 · alerts when available ≤ minimum</div></div><div><button class=btn>Send digest</button> <button class="btn primary">Import snapshot</button></div></header>
<div class=strip><div><b class=num>14</b><span>Open alerts</span></div><div><b class=num>5</b><span>Empty bins, minimum 0</span></div><div><b class=num>2,318</b><span>Positions checked</span></div><div><b>Email</b><span>On · last sent 06:12</span></div></div>
<div class=cols><section class=panel><div class=tools><input placeholder="Search part or location" aria-label=Search><select aria-label=Status><option>All open</option></select></div><div class=tw><table><thead><tr><th>Part<th>Location<th class=r>Available<th class=r>Min<th class=r>Max<th>Status<th>Opened</tr></thead><tbody>${R.map((r,i)=>`<tr class="${i==1?'sel':''}"><td>${r[0]}<td>${r[1]}<td class=r>${r[2]}<td class=r>${r[3]}<td class=r>${r[4]}<td>${tag('alert','Alert')}<td>${r[6]}</tr>`).join('')}</tbody></table></div></section>
<div><section class=panel><h2>Delivery</h2><div class=body><dl class=kv><dt>Email<dd>On<dt>Teams<dd>Off<dt>Webhook<dd>Off</dl><div class=note>Every change is sent once, with only the changes.</div></div></section>
<section class=panel><h2>Simulate stock</h2><div class=body><dl class=kv><dt>Part<dd>P-2210<dt>Available<dd><input class=num style="width:72px;font:inherit;padding:4px;border:1px solid var(--line-strong)" value=4></dl><div class=note>Edits are simulated and never change source files.</div><p><button class=btn>Reset simulated stock</button></p></div></section></div></div>`}
if(p==='predicted'){
const R=[['P-5521','B-04-09',28,20,9,21,'predicted'],['P-6107','C-02-01',12,10,4,12,'predicted'],['P-4410','A-11-06',35,20,9,40,'watch'],['P-7720','D-05-03',64,30,12,68,'watch'],['P-2931','B-08-12',90,30,12,120,'ok'],['P-3818','A-02-07',140,60,20,96,'ok']];
const T={predicted:tag('predicted','Predicted'),watch:tag('watch','Watch'),ok:tag('ok','OK')};
h=`<header class=page><div><h1>Predicted alerts</h1><div class=asof>Phase 2 · stock as of Oct 29, 06:10 · warns when hours to minimum ≤ lead time + 24 h</div></div><div><button class=btn>Export CSV</button> <button class="btn primary">Send predicted digest</button></div></header>
<div class=strip><div><b class=num>2</b><span>Predicted, emailed</span></div><div><b class=num>2</b><span>Watch, within 72 h</span></div><div><b class=num>1,364</b><span>Positions with a demand rate</span></div><div><b class=num>953</b><span>No rate, not forecast</span></div></div>
<div class=cols><section class=panel><div class=tools><input placeholder="Search part or location" aria-label=Search><select aria-label=Tier><option>Predicted and Watch</option><option>All</option></select></div><div class=tw><table><thead><tr><th>Part<th>Location<th class=r>Available<th class=r>Min<th class=r>Demand / day<th>Hours to minimum<th>Tier</tr></thead><tbody>${R.map((r,i)=>`<tr class="${i==0?'sel':''}"><td>${r[0]}<td>${r[1]}<td class=r>${r[2]}<td class=r>${r[3]}<td class=r>${r[4]}<td>${hb(r[5])}<span class=num>${r[5]} h</span><td>${T[r[6]]}</tr>`).join('')}</tbody></table></div><div class=note style="padding:0 var(--s4) var(--s3)">Bar: 0 to 72 h. Black tick: lead 3 h + safety 24 h = 27 h.</div></section>
<div><section class=panel><h2>P-5521 · B-04-09</h2><div class=body>
<svg viewBox="0 0 330 150" width=100% role=img aria-label="Projected stock reaches minimum in 21 hours"><rect x=40 y=10 width=${27/72*270} height=110 fill="var(--predicted-wash)"/><line x1=40 x2=310 y1=${120-20/40*110} y2=${120-20/40*110} stroke="var(--alert)" stroke-dasharray="4 3"/><text x=312 y=${120-20/40*110+4} text-anchor=start style="fill:var(--alert)">min</text><line x1=40 y1=${120-28/40*110} x2=310 y2=${120-(28-0.375*72)/40*110>120?120:120-(28-0.375*72)/40*110} stroke="var(--ink)" stroke-width=2 /><circle cx=${40+21/72*270} cy=${120-20/40*110} r=4 fill="var(--ink)"/><line x1=40 x2=40 y1=10 y2=120 stroke="var(--line-strong)"/><line x1=40 x2=310 y1=120 y2=120 stroke="var(--line-strong)"/><text x=34 y=${120-28/40*110+4} text-anchor=end>28</text><text x=34 y=124 text-anchor=end>0</text><text x=40 y=137>now</text><text x=${40+27/72*270} y=137 text-anchor=middle>27 h</text><text x=310 y=137 text-anchor=end>72 h</text></svg>
<div class=note>Shaded: lead + safety window. Line: stock falling at 9 per day.</div></div></section>
<section class=panel><h2>How it was calculated</h2><div class=body><div class=step><span>History / schedule</span><span class=num>8 / 10 per day</span></div><div class=step><span>Differ by</span><span class=num>25% (limit 50%)</span></div><div class=step><span>Demand</span><span class=num>(8 + 10) / 2 = 9</span></div><div class=step><span>Hours to minimum</span><span class=num>(28 − 20) / 9 × 24 = 21 h</span></div><div class=step><span>Suggested quantity</span><span class=num>70</span></div></div></section>
<section class=panel><h2>Settings <button class=btn>Edit</button></h2><div class=body><dl class=kv><dt>Lead time<dd>3 h<dt>Safety buffer<dd>24 h<dt>Watch window<dd>72 h<dt>Weights<dd>history 1 · schedule 1 · observed 0</dl></div></section></div></div>`}
if(p==='insights'){
const R=[['P-5521','B-04-09',9,6,[100,35,40,30,100,35]],['P-6107','C-02-01',7,4,[30,35,30,40,35,30]],['P-2210','A-07-02',5,5,[60,100,40,35,30,35]],['P-1042','A-03-11',4,3,[35,30,35,100,40,30]],['P-4410','A-11-06',3,6,[100,100,95,100,90,100]]];
const dots=a=>`<svg viewBox="0 0 120 14" width=120 height=14 role=img aria-label="Refill reach as percent of maximum"><line x1=0 x2=120 y1=7 y2=7 stroke="var(--line)"/>${a.map(v=>`<circle cx=${v*1.18} cy=7 r=3.5 fill="var(--accent)"/>`).join('')}<line x1=118 x2=118 y1=0 y2=14 stroke="var(--ink)"/></svg>`;
h=`<header class=page><div><h1>Replenishment insights</h1><div class=asof>Transfer log, last 30 days · parts that spend time under minimum or refill short of maximum</div></div><div><button class=btn>Export CSV</button></div></header>
<div class=strip><div><b class=num>38</b><span>Parts flagged</span></div><div><b class=num>12</b><span>Under minimum 3+ days</span></div><div><b class=num>35%</b><span>Median refill, share of maximum</span></div><div><b class=num>19%</b><span>Refills reaching 95% of max</span></div></div>
<div class=cols><section class=panel><div class=tools><input placeholder="Search part or location" aria-label=Search><select aria-label=Lens><option>Days under minimum</option><option>Short refills</option><option>Schedule vs history</option></select></div><div class=tw><table><thead><tr><th>Part<th>Location<th class=r>Days under min<th class=r>Refills, 30 d<th>Refill reach, % of max<th>Flag</tr></thead><tbody>${R.map((r,i)=>`<tr class="${i==0?'sel':''}"><td>${r[0]}<td>${r[1]}<td class=r>${r[2]}<td class=r>${r[3]}<td>${dots(r[4])}<td>${r[2]>=5?tag('alert','Review'):r[4].every(v=>v>=90)?tag('ok','Fine'):tag('predicted','Short refills')}</tr>`).join('')}</tbody></table></div><div class=note style="padding:0 var(--s4) var(--s3)">Each dot is one refill. Black tick: maximum (100%).</div></section>
<div><section class=panel><h2>P-5521 · B-04-09</h2><div class=body>
<svg viewBox="0 0 330 150" width=100% role=img aria-label="Refill heights for six refills"><line x1=40 x2=310 y1=30 y2=30 stroke="var(--ink)" stroke-dasharray="4 3"/><text x=310 y=24 text-anchor=end>max</text>${[100,35,40,30,100,35].map((v,i)=>`<rect x=${52+i*43} y=${120-v*.9} width=28 height=${v*.9} fill="var(--accent)"/><text x=${66+i*43} y=${120-v*.9-4} text-anchor=middle>${v}%</text><text x=${66+i*43} y=137 text-anchor=middle>${['Oct 2','Oct 6','Oct 11','Oct 15','Oct 20','Oct 25'][i]}</text>`).join('')}<line x1=40 x2=310 y1=120 y2=120 stroke="var(--line-strong)"/></svg>
<div class=note>Four of six refills stopped near a third of maximum.</div></div></section>
<section class=panel><h2>Evidence</h2><div class=body><div class=step><span>Under minimum</span><span class=num>9 days of 30</span></div><div class=step><span>History / schedule</span><span class=num>8 / 14 per day</span></div><div class=step><span>Max for 7 days of cover</span><span class=num>90 (now 60)</span></div></div></section></div></div>`}
document.getElementById('main').innerHTML=h;
</script>
