<svg id="arch-live" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" role="img" aria-label="Live data architecture: a connector and ingest routes feed new readings and transfers tables; analysis and the locked formulas are reused."><defs><marker id="ah-arch-live" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" style="fill:#17262f"/></marker></defs><rect width="1180" height="650" style="fill:#ffffff"/><text x="16" y="26" style="font:700 16px Helvetica,Arial,sans-serif;fill:#17262f">Live data: what we would add (solid green = needed, dashed = nice to have)</text><rect x="16" y="50" width="226" height="400" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="26" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Siemens side (Siemens owns this)</text><rect x="28" y="72" width="202" height="78" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Live stock readings</text><text x="38" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">material, bin, available,</text><text x="38" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">timestamp (e.g. a Snowflake</text><text x="38" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">or LXO2 view; to confirm)</text><rect x="28" y="166" width="202" height="78" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="186" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Transfer orders</text><text x="38" y="202" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">created, confirmed, qty,</text><text x="38" y="218" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">bins (open and confirmed)</text><rect x="28" y="260" width="202" height="64" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="280" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Min/Max, BOM, schedule</text><text x="38" y="296" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">change slowly: daily or weekly</text><rect x="28" y="340" width="202" height="96" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="360" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Network and identity</text><text x="38" y="376" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">service account or API key,</text><text x="38" y="392" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">firewall rule, TLS: Siemens IT</text><text x="38" y="408" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">decides how the app is hosted</text><rect x="280" y="50" width="230" height="400" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="290" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Connector (new)</text><rect x="292" y="72" width="206" height="98" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="302" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Pull or push adapter</text><text x="302" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">poll every N minutes, or</text><text x="302" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">receive pushed events;</text><text x="302" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">maps Siemens columns to</text><text x="302" y="156" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">our field names (config)</text><rect x="292" y="186" width="206" height="78" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="302" y="206" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">POST /api/ingest/*</text><text x="302" y="222" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">stock, transfers, tolerances,</text><text x="302" y="238" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">bom, schedule; JSON batches,</text><text x="302" y="254" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">idempotent by event id</text><rect x="292" y="280" width="206" height="66" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="302" y="300" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Auth</text><text x="302" y="316" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">bearer token; non-local</text><text x="302" y="332" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">bind only for ingest routes</text><rect x="292" y="362" width="206" height="72" rx="6" style="fill:#ffffff;stroke:#5b7a99;stroke-width:1.6" stroke-dasharray="6 4"/><text x="302" y="382" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Mapping and replay</text><text x="302" y="398" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">keep raw payloads;</text><text x="302" y="414" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">rerun after a mapping fix</text><rect x="548" y="50" width="244" height="400" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="558" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Store (extend)</text><rect x="560" y="72" width="220" height="78" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="570" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">stock_readings (new)</text><text x="570" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">position, timestamp, available,</text><text x="570" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">source; keep 90 days, then</text><text x="570" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">thin to hourly</text><rect x="560" y="166" width="220" height="78" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="570" y="186" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">transfers (new, upsert)</text><text x="570" y="202" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">keyed by transfer order +</text><text x="570" y="218" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">item; replaces re-importing</text><text x="570" y="234" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">the whole workbook</text><rect x="560" y="260" width="220" height="66" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="570" y="280" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">existing tables</text><text x="570" y="296" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">records, references,</text><text x="570" y="312" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">alerts, settings</text><rect x="560" y="342" width="220" height="92" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="570" y="362" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">ingest_status (new)</text><text x="570" y="378" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">last event time per feed,</text><text x="570" y="394" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">lag, rejected rows;</text><text x="570" y="410" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">shown in /api/health and UI</text><rect x="830" y="50" width="336" height="400" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="840" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Compute and out (small changes)</text><rect x="842" y="72" width="150" height="98" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="852" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">analytics.py</text><text x="852" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">rates from transfers;</text><text x="852" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">refresh on a timer,</text><text x="852" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">not on every reading</text><rect x="1004" y="72" width="150" height="98" rx="6" style="fill:#fff1cf;stroke:#a86f00;stroke-width:1.6"/><text x="1014" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">proactive.py</text><text x="1014" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">formulas unchanged;</text><text x="1014" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">reads latest reading</text><text x="1014" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">instead of daily file</text><rect x="842" y="186" width="312" height="78" rx="6" style="fill:#ffffff;stroke:#5b7a99;stroke-width:1.6" stroke-dasharray="6 4"/><text x="852" y="206" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Alert rules</text><text x="852" y="222" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">hysteresis (no flapping near min), stale-data flag</text><text x="852" y="238" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">("no reading for N h"), real open-since time</text><rect x="842" y="280" width="150" height="66" rx="6" style="fill:#ffffff;stroke:#5b7a99;stroke-width:1.6" stroke-dasharray="6 4"/><text x="852" y="300" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Browser page</text><text x="852" y="316" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">real clock on chart</text><text x="852" y="332" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">axis, "updated 2 min ago"</text><rect x="1004" y="280" width="150" height="66" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="1014" y="300" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Notifications</text><text x="1014" y="316" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">unchanged; add</text><text x="1014" y="332" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">rate limit per bin</text><rect x="842" y="362" width="312" height="72" rx="6" style="fill:#ffffff;stroke:#5b7a99;stroke-width:1.6" stroke-dasharray="6 4"/><text x="852" y="382" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Backtest on live data (nice)</text><text x="852" y="398" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">log each predicted crossing time, then compare</text><text x="852" y="414" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">with when stock really crossed: first real timing test</text><polyline points="242,111 280,111" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-live)"/><text x="261" y="102" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">readings</text><polyline points="242,205 280,205" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-live)"/><text x="261" y="196" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">transfers</text><polyline points="510,225 548,225" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-live)"/><text x="529" y="216" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">validated</text><polyline points="792,111 830,111" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-live)"/><text x="811" y="102" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">reads</text><polyline points="998,121 1004,121" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-live)"/><rect x="16" y="478" width="1150" height="150" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="26" y="498" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Rough estimate (ours, not validated) and what to ask Siemens</text><text x="26" y="514" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Needed for a first live version: connector, three ingest routes (stock, transfers, tolerances), the readings table, auth, ingest status. Our rough guess: 2 to 3 weeks for one developer, plus Siemens IT lead time.</text><text x="26" y="530" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Nice to have: hysteresis and stale-data flags, mapping with replay, real clock on the chart, a timing backtest on live data.</text><text x="26" y="546" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Not built today: any of the connector, ingest routes, auth, readings table or incremental transfers. The UI and forecast code can be reused as is.</text><text x="26" y="562" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Ask Siemens: which system is the source of live stock and how often it updates; whether the app may be hosted on a Siemens server;</text><text x="26" y="578" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">who owns credentials; the time zone and the exact column names; whether the live feed carries who confirmed a transfer; how deletions and corrections arrive.</text></svg>