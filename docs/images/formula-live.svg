<svg id="formula-live" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" role="img" aria-label="The locked formulas take a current available stock, so live readings plug in without changing them; live data adds precision and a way to validate timing."><defs><marker id="ah-formula-live" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" style="fill:#17262f"/></marker></defs><rect width="1180" height="640" style="fill:#ffffff"/><text x="16" y="26" style="font:700 16px Helvetica,Arial,sans-serif;fill:#17262f">Live data and the locked formulas: same arithmetic, fresher inputs</text><rect x="16" y="50" width="268" height="86" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="26" y="70" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">available (input)</text><text x="26" y="86" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">today: newest daily file, up to a</text><text x="26" y="102" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">day old</text><text x="26" y="118" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">live: latest reading, minutes old</text><rect x="300" y="50" width="268" height="86" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="310" y="70" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">min and max (input)</text><text x="310" y="86" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Min/Max file, changes rarely</text><text x="310" y="102" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">live: same file or feed; no change</text><rect x="584" y="50" width="268" height="86" rx="6" style="fill:#fff1cf;stroke:#a86f00;stroke-width:1.6"/><text x="594" y="70" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">demand per day (input)</text><text x="594" y="86" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">2 x history + 1 x schedule, divided by 3</text><text x="594" y="102" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">history = transfers in last 30/45/60 d</text><rect x="868" y="50" width="298" height="86" rx="6" style="fill:#ffffff;stroke:#5b7a99;stroke-width:1.6" stroke-dasharray="6 4"/><text x="878" y="70" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">observed depletion (weight 0)</text><text x="878" y="86" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">today: drops between daily files</text><text x="878" y="102" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">live: drops between readings; denser</text><polyline points="150,136 150,176" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-formula-live)"/><polyline points="434,136 434,176" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-formula-live)"/><polyline points="718,136 718,176" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-formula-live)"/><polyline points="1017,136 1017,156 718,156 718,176" style="fill:none;stroke:#5b7a99;stroke-width:1.6" marker-end="url(#ah-formula-live)" stroke-dasharray="6 4"/><text x="900" y="150" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#5b7a99">optional</text><rect x="16" y="176" width="1150" height="78" rx="6" style="fill:#fff1cf;stroke:#a86f00;stroke-width:1.6"/><text x="26" y="196" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">hours to minimum = max(0, available - min) / demand x 24</text><text x="26" y="212" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Locked. The formula only needs a current available. It does not care whether that number is a day old or a minute old, so it works unchanged with live data.</text><text x="26" y="228" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Alert: available &lt;= min. Predicted: hours to minimum &lt;= lead time + safety buffer. Suggested qty = ceil(max - (available - demand x lead / 24)).</text><polyline points="591,254 591,288" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-formula-live)"/><text x="591.0" y="265.0" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">tier, qty, hours</text><text x="16" y="316" text-anchor="start" style="font:700 15px Helvetica,Arial,sans-serif;fill:#17262f">What changes with live data</text><rect x="16" y="330" width="570" height="104" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="26" y="350" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Better, no code change</text><text x="26" y="366" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Available is current, so "hours to minimum" is current.</text><text x="26" y="382" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Today a bin that emptied at 6 am still looks fine until the next file.</text><rect x="596" y="330" width="570" height="104" rx="6" style="fill:#d9f0ee;stroke:#00757a;stroke-width:1.6"/><text x="606" y="350" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Better, small change</text><text x="606" y="366" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Open-since becomes the real time stock crossed the minimum.</text><text x="606" y="382" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Chart axis can use clock time instead of "hours from now".</text><rect x="16" y="448" width="570" height="104" rx="6" style="fill:#fbe3e0;stroke:#b3261e;stroke-width:1.6"/><text x="26" y="468" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Needs care</text><text x="26" y="484" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Readings jump up at every refill. Observed depletion only counts drops,</text><text x="26" y="500" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">so it holds, but refills must not look like negative demand.</text><text x="26" y="516" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">A bin hovering at the minimum can flap: add hysteresis.</text><rect x="596" y="448" width="570" height="104" rx="6" style="fill:#fbe3e0;stroke:#b3261e;stroke-width:1.6"/><text x="606" y="468" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Not solved by live stock</text><text x="606" y="484" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Demand is still estimated from transfers and the plan.</text><text x="606" y="500" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Live stock does not remove that error. It lets us measure it.</text><rect x="16" y="568" width="1150" height="60" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="26" y="588" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Does the forecast get better?</text><text x="26" y="604" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Likely, mainly through fresher available and the chance to validate. Not proven: no timing test exists today, so say "expected", not "will".</text></svg>