<svg id="arch-today" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 530" width="1180" role="img" aria-label="Current architecture: files are exported by a person and uploaded; the app stores them, analyses on request and shows or sends alerts. Nothing is fetched from Siemens."><defs><marker id="ah-arch-today" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" style="fill:#17262f"/></marker></defs><rect width="1180" height="530" style="fill:#ffffff"/><text x="16" y="26" style="font:700 16px Helvetica,Arial,sans-serif;fill:#17262f">Today: files in, batch analysis, browser and alerts out</text><rect x="16" y="50" width="214" height="300" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="26" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Siemens files (by hand)</text><rect x="28" y="72" width="190" height="58" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Workbook .xlsx</text><text x="38" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">4 sheets: production,</text><text x="38" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">schedule, transfers, bin status</text><rect x="28" y="140" width="190" height="58" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="160" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Min/Max file</text><text x="38" y="176" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Part, Location, Min, Max</text><rect x="28" y="208" width="190" height="58" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="228" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">BOM file</text><text x="38" y="244" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Item, Part, Qty</text><rect x="28" y="276" width="190" height="58" rx="6" style="fill:#e8eefb;stroke:#3f5fa8;stroke-width:1.6"/><text x="38" y="296" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Bin_Status_YYYY-MM-DD</text><text x="38" y="312" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Daily file: Live Value per bin</text><rect x="262" y="50" width="212" height="300" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="272" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Import (this computer only)</text><rect x="274" y="72" width="188" height="66" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="284" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Upload</text><text x="284" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Data sources page,</text><text x="284" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">run.sh, or CLI --attach</text><rect x="274" y="154" width="188" height="66" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="284" y="174" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">POST /api/import</text><text x="284" y="190" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">binary XLSX, up to 32 MB</text><text x="284" y="206" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Host and Origin must be local</text><rect x="274" y="236" width="188" height="66" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="284" y="256" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">ingest.py</text><text x="284" y="272" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">checks sheets, columns,</text><text x="284" y="288" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">dates, duplicates</text><rect x="506" y="50" width="230" height="300" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="516" y="70" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">SQLite (store.py)</text><text x="518" y="90" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">records</text><text x="518" y="106" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">workbook rows, kept as received</text><text x="518" y="132" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">references</text><text x="518" y="148" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Min/Max, BOM, every daily snapshot</text><text x="518" y="174" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">stock_overrides</text><text x="518" y="190" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">simulated Available edits</text><text x="518" y="216" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">stock_alerts</text><text x="518" y="232" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">open / acknowledged, with times</text><text x="518" y="258" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">stock_settings, presets</text><text x="518" y="274" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">lead times, weights, window</text><text x="518" y="300" text-anchor="start" style="font:700 12.5px Helvetica,Arial,sans-serif;fill:#17262f">notifications, feedback</text><text x="518" y="316" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">saved messages</text><rect x="768" y="50" width="190" height="300" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="778" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Analysis (on request)</text><rect x="780" y="72" width="166" height="100" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="790" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">analytics.py</text><text x="790" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">history rate over 30, 45</text><text x="790" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">or 60 days; last refill;</text><text x="790" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">cached per dataset</text><rect x="780" y="196" width="166" height="130" rx="6" style="fill:#fff1cf;stroke:#a86f00;stroke-width:1.6"/><text x="790" y="216" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">proactive.py</text><text x="790" y="232" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">LOCKED formulas:</text><text x="790" y="248" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">demand blend,</text><text x="790" y="264" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">hours to minimum,</text><text x="790" y="280" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">tiers, suggested qty</text><rect x="990" y="50" width="176" height="300" rx="8" style="fill:none;stroke:#8a98a4;stroke-width:1;stroke-dasharray:2 4"/><text x="1000" y="66" text-anchor="start" style="font:700 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Out</text><rect x="1002" y="72" width="152" height="112" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="1012" y="92" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">Browser page</text><text x="1012" y="108" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">GET /api/stock,</text><text x="1012" y="124" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">/api/insights/parts</text><text x="1012" y="140" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Stock, Predicted,</text><text x="1012" y="156" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Insights</text><rect x="1002" y="200" width="152" height="126" rx="6" style="fill:#eef1f4;stroke:#9aa7b2;stroke-width:1.6"/><text x="1012" y="220" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">alerts.py</text><text x="1012" y="236" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">email (SMTP), Teams,</text><text x="1012" y="252" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">webhook, or .eml</text><text x="1012" y="268" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">file in outputs/outbox</text><polyline points="230,211 262,211" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-today)"/><text x="246" y="202" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">upload</text><polyline points="474,211 506,211" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-today)"/><text x="490" y="202" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">writes</text><polyline points="736,120 768,120" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-today)"/><text x="752" y="111" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">reads</text><polyline points="958,140 990,140" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-today)"/><text x="974" y="131" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">tiers</text><polyline points="958,262 990,262" style="fill:none;stroke:#17262f;stroke-width:1.6" marker-end="url(#ah-arch-today)"/><text x="974" y="253" text-anchor="middle" style="font:600 11px Helvetica,Arial,sans-serif;fill:#17262f">new alerts</text><rect x="16" y="376" width="1150" height="96" rx="6" style="fill:#fbe3e0;stroke:#b3261e;stroke-width:1.6"/><text x="26" y="396" text-anchor="start" style="font:700 13px Helvetica,Arial,sans-serif;fill:#17262f">What this means for data freshness</text><text x="26" y="412" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">Data changes only when someone exports a file and uploads it. Nothing in the app fetches data from Siemens.</text><text x="26" y="428" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">"Available" comes from the newest dated bin-status file (or a simulated edit). Older snapshots are kept and only feed the observed-depletion input, which has weight 0.</text><text x="26" y="444" text-anchor="start" style="font:400 11.5px Helvetica,Arial,sans-serif;fill:#56646f">A re-exported workbook becomes a new dataset (identified by its checksum); transfers are not appended one at a time. --check-minutes re-evaluates stored data on a timer; it does not fetch anything.</text><text x="16" y="500" text-anchor="start" style="font:400 12px Helvetica,Arial,sans-serif;fill:#56646f">Grey = exists today. Amber = locked formulas (docs/formulas.md). Blue = Siemens-owned files.</text></svg>